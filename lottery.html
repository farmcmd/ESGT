<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探探里山 - 永續抽獎慶典</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        
        /* 慶典背景動畫 */
        .bg-celebration {
            background: radial-gradient(circle at center, #2e1065 0%, #0f172a 100%);
            position: relative;
            overflow: hidden;
        }
        .bg-celebration::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(251,191,36,0.1) 10%, transparent 20%),
                        radial-gradient(circle, rgba(251,191,36,0.1) 10%, transparent 20%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            animation: moveBackground 30s linear infinite;
            z-index: 0;
        }
        @keyframes moveBackground {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 隱藏觸發區 */
        .secret-trigger {
            position: fixed; bottom: 0; right: 0; width: 60px; height: 60px; z-index: 50; cursor: default;
        }

        /* 跑馬燈開獎動畫 */
        .slot-machine-text {
            background: linear-gradient(to right, #fbbf24, #f59e0b, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 0.1s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.8; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1.02); }
        }

        /* 閃爍進場 */
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-celebration text-white min-h-screen flex flex-col relative">

    <!-- 主視覺與公開展示區 -->
    <main class="relative z-10 flex-grow flex flex-col items-center pt-16 px-4 pb-20">
        <div class="text-center mb-12">
            <h2 class="text-xl md:text-2xl text-amber-400 font-bold tracking-widest mb-2">探探里山 永續旅遊平台</h2>
            <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-400 to-yellow-600 drop-shadow-lg" id="display-event-title">
                載入活動中...
            </h1>
        </div>

        <!-- 開獎結果展示卡片 -->
        <div id="winners-container" class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- 得獎名單動態注入區 -->
        </div>

        <!-- 尚未開獎或無資料狀態 -->
        <div id="empty-state" class="flex flex-col items-center justify-center mt-20 opacity-80">
            <svg class="w-24 h-24 text-amber-500/50 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p class="text-xl text-amber-200 tracking-wide">等待吉時，即將開獎</p>
        </div>
    </main>

    <!-- 動畫重疊層 (抽獎進行中) -->
    <div id="draw-animation-overlay" class="fixed inset-0 bg-black/90 z-40 hidden flex-col items-center justify-center backdrop-blur-sm">
        <h3 class="text-3xl text-amber-400 font-bold mb-8">幸運兒抽出中...</h3>
        <div class="bg-gradient-to-b from-gray-800 to-gray-900 border-2 border-amber-500 rounded-2xl p-8 shadow-[0_0_50px_rgba(245,158,11,0.3)] w-11/12 max-w-lg text-center">
            <div id="slot-name" class="slot-machine-text text-5xl font-black mb-4">王*明</div>
            <div id="slot-serial" class="text-2xl text-gray-400 tracking-widest font-mono">A01***001</div>
        </div>
    </div>

    <!-- 隱藏觸發區 (點擊右下角5次開啟管理員) -->
    <div id="secret-trigger" class="secret-trigger"></div>

    <!-- 管理員控制台 Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center backdrop-blur-md p-4">
        <div class="bg-slate-800 border border-slate-600 rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
            <button id="close-admin" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <h2 class="text-2xl font-bold text-amber-500 mb-6 flex items-center">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                開獎控制台
            </h2>

            <div class="space-y-4">
                <!-- 選擇活動 -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">1. 選擇抽獎活動</label>
                    <select id="select-event" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="">請選擇活動...</option>
                    </select>
                </div>

                <!-- 選擇歸戶類型 -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">2. 選擇歸戶類型</label>
                    <select id="select-category" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="all">全部 (All)</option>
                        <option value="ent">企業 (Enterprise)</option>
                        <option value="gov">政府 (Government)</option>
                    </select>
                </div>

                <!-- 選擇歸戶卡片代碼 -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">3. 選擇歸戶卡片代碼</label>
                    <select id="select-card" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="all">不限卡片</option>
                    </select>
                </div>

                <!-- 抽出人數 -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">4. 設定抽出人數</label>
                    <input type="number" id="draw-count" min="1" value="1" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-amber-500 outline-none">
                </div>

                <!-- 狀態提示 -->
                <div id="pool-status" class="text-sm text-amber-400 font-medium bg-amber-900/30 p-3 rounded-lg text-center hidden">
                    符合條件的票數：<span id="pool-count">0</span> 張
                </div>

                <!-- 按鈕區 -->
                <div class="pt-4 flex gap-3">
                    <button id="btn-mock-data" class="flex-1 bg-slate-600 hover:bg-slate-500 text-white font-bold py-3 px-4 rounded-lg transition-colors text-sm">
                        產生測試資料
                    </button>
                    <button id="btn-draw" class="flex-[2] bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transform active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        開始開獎！
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (Canvas Environment)
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // State Management
        let allEvents = [];
        let allTickets = [];
        let filteredTickets = [];
        let currentUser = null;

        // UI Elements
        const DOM = {
            secretTrigger: document.getElementById('secret-trigger'),
            adminModal: document.getElementById('admin-modal'),
            closeAdmin: document.getElementById('closeAdmin'),
            selectEvent: document.getElementById('select-event'),
            selectCategory: document.getElementById('select-category'),
            selectCard: document.getElementById('select-card'),
            drawCount: document.getElementById('draw-count'),
            poolStatus: document.getElementById('pool-status'),
            poolCount: document.getElementById('pool-count'),
            btnDraw: document.getElementById('btn-draw'),
            btnMock: document.getElementById('btn-mock-data'),
            overlay: document.getElementById('draw-animation-overlay'),
            slotName: document.getElementById('slot-name'),
            slotSerial: document.getElementById('slot-serial'),
            winnersContainer: document.getElementById('winners-container'),
            emptyState: document.getElementById('empty-state'),
            displayEventTitle: document.getElementById('display-event-title')
        };

        // --- Utility Functions ---

        // 姓名隱碼 (陳明 -> 陳*明, 李四 -> 李*)
        const maskName = (name) => {
            if (!name) return '未知';
            if (name.length <= 1) return name;
            if (name.length === 2) return name[0] + '*';
            return name[0] + '*'.repeat(name.length - 2) + name[name.length - 1];
        };

        // 序號隱碼 (A012345A001 -> A01***A001)
        const maskSerial = (serial) => {
            if (!serial) return '***';
            if (serial.length <= 6) return serial.substring(0,2) + '***' + serial.substring(serial.length-2);
            return serial.substring(0, 3) + '***' + serial.substring(serial.length - 4);
        };

        // --- Authentication (Rule 3) ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
                DOM.displayEventTitle.innerText = "系統驗證失敗";
            }
        };

        // --- Data Fetching (Rule 1 & 2) ---
        const loadData = () => {
            if (!currentUser) return;

            // Strict path for public data
            const eventsRef = collection(db, 'artifacts', appId, 'public', 'data', 'lottery_events');
            const ticketsRef = collection(db, 'artifacts', appId, 'public', 'data', 'lottery_tickets');

            // Listen to Events
            onSnapshot(eventsRef, (snapshot) => {
                allEvents = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updateEventDropdown();
                if(allEvents.length > 0) {
                    DOM.displayEventTitle.innerText = allEvents[0].title || '準備開獎';
                } else {
                    DOM.displayEventTitle.innerText = '尚無活動資料';
                }
            }, (error) => console.error("Events fetch error:", error));

            // Listen to Tickets
            onSnapshot(ticketsRef, (snapshot) => {
                allTickets = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                filterTickets(); // Re-filter if admin panel is adjusting
            }, (error) => console.error("Tickets fetch error:", error));
        };

        // --- Admin Logic ---

        // 隱藏觸發機制
        let clickCount = 0;
        let clickTimer = null;
        DOM.secretTrigger.addEventListener('click', () => {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount >= 5) {
                DOM.adminModal.classList.remove('hidden');
                DOM.adminModal.classList.add('flex');
                clickCount = 0;
            }
            clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
        });

        document.getElementById('close-admin').addEventListener('click', () => {
            DOM.adminModal.classList.add('hidden');
            DOM.adminModal.classList.remove('flex');
        });

        // 更新下拉選單
        const updateEventDropdown = () => {
            const currentVal = DOM.selectEvent.value;
            DOM.selectEvent.innerHTML = '<option value="">請選擇活動...</option>' + 
                allEvents.map(e => `<option value="${e.id}">${e.title} ${e.isActive?'(進行中)':'(已結束)'}</option>`).join('');
            if (currentVal) DOM.selectEvent.value = currentVal;
        };

        const updateCardDropdown = (eventId, category) => {
            const cards = new Set();
            allTickets.forEach(t => {
                if (t.eventId === eventId && (category === 'all' || t.targetCategory === category)) {
                    if(t.targetCardId) cards.add(t.targetCardId);
                }
            });
            DOM.selectCard.innerHTML = '<option value="all">不限卡片</option>' + 
                Array.from(cards).map(c => `<option value="${c}">${c}</option>`).join('');
        };

        // 過濾票箱 (在記憶體中進行，符合 Rule 2)
        const filterTickets = () => {
            const eventId = DOM.selectEvent.value;
            const category = DOM.selectCategory.value;
            const cardId = DOM.selectCard.value;

            if (!eventId) {
                filteredTickets = [];
                updateDrawButtonState();
                return;
            }

            filteredTickets = allTickets.filter(t => {
                const matchEvent = t.eventId === eventId;
                const matchCategory = category === 'all' || t.targetCategory === category;
                const matchCard = cardId === 'all' || t.targetCardId === cardId;
                return matchEvent && matchCategory && matchCard;
            });

            DOM.poolStatus.classList.remove('hidden');
            DOM.poolCount.innerText = filteredTickets.length;
            updateDrawButtonState();
        };

        const updateDrawButtonState = () => {
            const count = parseInt(DOM.drawCount.value) || 0;
            DOM.btnDraw.disabled = filteredTickets.length === 0 || count < 1 || count > filteredTickets.length;
        };

        // 監聽管理員過濾條件改變
        DOM.selectEvent.addEventListener('change', (e) => {
            updateCardDropdown(e.target.value, DOM.selectCategory.value);
            filterTickets();
            // Update Background display title
            const evt = allEvents.find(ev => ev.id === e.target.value);
            if(evt) DOM.displayEventTitle.innerText = evt.title;
        });
        DOM.selectCategory.addEventListener('change', (e) => {
            updateCardDropdown(DOM.selectEvent.value, e.target.value);
            filterTickets();
        });
        DOM.selectCard.addEventListener('change', filterTickets);
        DOM.drawCount.addEventListener('input', updateDrawButtonState);

        // --- 動畫與開獎邏輯 ---
        
        DOM.btnDraw.addEventListener('click', () => {
            const count = parseInt(DOM.drawCount.value);
            if(count > filteredTickets.length) return;

            // 關閉管理面板，開啟動畫覆蓋層
            DOM.adminModal.classList.add('hidden');
            DOM.adminModal.classList.remove('flex');
            DOM.overlay.classList.remove('hidden');
            DOM.overlay.classList.add('flex');

            // 隨機選出中獎者 (洗牌演算法取出 N 個)
            const pool = [...filteredTickets];
            const winners = [];
            for (let i = 0; i < count; i++) {
                const randIdx = Math.floor(Math.random() * pool.length);
                winners.push(pool.splice(randIdx, 1)[0]);
            }

            // 跑馬燈動畫效應
            let ticks = 0;
            const maxTicks = 40; // 動畫總幀數
            const interval = setInterval(() => {
                // 亂數展示
                const randomTicket = filteredTickets[Math.floor(Math.random() * filteredTickets.length)];
                DOM.slotName.innerText = maskName(randomTicket.playerName);
                DOM.slotSerial.innerText = maskSerial(randomTicket.serial);
                
                ticks++;
                if (ticks >= maxTicks) {
                    clearInterval(interval);
                    showWinners(winners);
                }
            }, 80); // 速度
        });

        const showWinners = (winners) => {
            // 隱藏動畫，顯示名單
            setTimeout(() => {
                DOM.overlay.classList.remove('flex');
                DOM.overlay.classList.add('hidden');
                
                DOM.emptyState.classList.add('hidden');
                DOM.winnersContainer.classList.remove('hidden');
                
                // 產生卡片並帶入動畫
                DOM.winnersContainer.innerHTML = winners.map((w, idx) => `
                    <div class="bg-gradient-to-br from-slate-800 to-slate-900 border border-amber-500/30 rounded-2xl p-6 shadow-xl relative overflow-hidden fade-in-up" style="animation-delay: ${idx * 0.15}s">
                        <div class="absolute top-0 right-0 w-16 h-16 bg-amber-500/10 rounded-bl-full"></div>
                        <div class="text-amber-500 text-sm font-bold tracking-wider mb-1">幸運得主</div>
                        <h3 class="text-3xl font-black text-white mb-2 tracking-widest">${maskName(w.playerName)}</h3>
                        <div class="inline-block bg-slate-950 px-3 py-1 rounded text-sm font-mono text-gray-400 border border-slate-700">
                            序號: ${maskSerial(w.serial)}
                        </div>
                        <div class="mt-4 text-xs text-gray-500">
                            歸戶代碼: ${w.targetCardId || 'N/A'}
                        </div>
                    </div>
                `).join('');
            }, 500);
        };


        // --- Mock Data Generator (For Testing without DB config initially) ---
        DOM.btnMock.addEventListener('click', async () => {
            if(!currentUser) return;
            DOM.btnMock.innerText = "寫入中...";
            DOM.btnMock.disabled = true;

            const eventsRef = collection(db, 'artifacts', appId, 'public', 'data', 'lottery_events');
            const ticketsRef = collection(db, 'artifacts', appId, 'public', 'data', 'lottery_tickets');

            try {
                const eventId = "evt_" + new Date().getTime();
                await setDoc(doc(eventsRef, eventId), {
                    title: "2026 探探里山春季永續大賞",
                    isActive: true,
                    targetCategory: "all",
                    targetBoard: "首頁橫幅"
                });

                const mockNames = ["陳大明", "林美麗", "張志豪", "王曉玲", "李建國", "黃淑芬", "吳家豪", "周杰", "鄭成功", "蔡依林"];
                
                for(let i=0; i<15; i++) {
                    const isEnt = Math.random() > 0.5;
                    await setDoc(doc(ticketsRef, "tkt_" + i + "_" + new Date().getTime()), {
                        serial: `A0${i+1}XXX${Math.floor(Math.random()*9000)+1000}`,
                        eventId: eventId,
                        targetCategory: isEnt ? 'ent' : 'gov',
                        targetCardId: isEnt ? 'USI88' : 'GOV01',
                        playerName: mockNames[Math.floor(Math.random() * mockNames.length)],
                        timestamp: new Date().toISOString()
                    });
                }
                DOM.btnMock.innerText = "資料已產生";
                setTimeout(() => { DOM.btnMock.innerText = "產生測試資料"; DOM.btnMock.disabled = false; }, 2000);
            } catch (err) {
                console.error("Mock Data Error:", err);
                DOM.btnMock.innerText = "寫入失敗";
                DOM.btnMock.disabled = false;
            }
        });

        // --- Initialization ---
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                loadData();
            }
        });

        initAuth();

    </script>
</body>
</html>
