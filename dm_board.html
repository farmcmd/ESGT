<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探探里山 - 數位 DM 看板</title>
    <!-- 使用 Tailwind CSS 打造現代化視覺 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0fdf4; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-btn { transition: all 0.3s ease; }
        .tab-btn.active { background-color: #16a34a; color: white; border-color: #16a34a; transform: scale(1.05); box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.4); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- 頂部活動導覽列 (至少顯示5個) -->
    <div class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3">
            <h1 class="text-xl font-bold text-green-800 mb-3 flex items-center">
                <span class="text-2xl mr-2">🌿</span> 探探里山活動快訊
            </h1>
            <div id="nav-container" class="flex gap-3 overflow-x-auto hide-scrollbar pb-2">
                <!-- 按鈕由 JS 動態生成 -->
                <div class="text-gray-400 text-sm py-2">連線雲端資料庫中...</div>
            </div>
        </div>
    </div>

    <!-- 主要 DM 展示區 -->
    <div class="max-w-5xl mx-auto px-4 mt-6">
        <div id="content-container" class="bg-white rounded-2xl shadow-xl overflow-hidden hidden transition-opacity duration-500">
            
            <!-- 大版面 DM 圖片 -->
            <div class="relative w-full bg-gray-100 flex justify-center items-center min-h-[300px]">
                <img id="display-image" src="" alt="活動DM" class="w-full max-w-4xl object-contain" onerror="this.src='https://placehold.co/800x400?text=圖片載入失敗';">
            </div>

            <!-- 報名資訊與操作區 -->
            <div class="p-6 md:p-8 bg-gradient-to-b from-white to-green-50">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-green-100 pb-4 mb-4">
                    <div>
                        <h2 id="display-title" class="text-3xl font-black text-gray-800 tracking-tight">活動標題</h2>
                        <p id="display-date" class="text-green-600 font-semibold mt-1 flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <span id="display-date-text">活動日期</span>
                        </p>
                    </div>
                    <!-- 報名按鈕 -->
                    <a id="display-link" href="#" target="_blank" class="w-full md:w-auto text-center px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-full shadow-lg transform transition hover:-translate-y-1">
                        👉 立即前往報名
                    </a>
                </div>
                
                <div class="prose max-w-none">
                    <h3 class="text-lg font-bold text-gray-700 mb-2">活動說明與報名資訊</h3>
                    <p id="display-info" class="text-gray-600 whitespace-pre-line leading-relaxed text-sm md:text-base">
                        報名資訊載入中...
                    </p>
                </div>
            </div>
        </div>

        <!-- 查無資料或錯誤時顯示 -->
        <div id="empty-state" class="text-center py-20 hidden">
            <span id="empty-icon" class="text-6xl">📭</span>
            <h3 id="empty-title" class="text-xl font-bold text-gray-500 mt-4">目前尚無上架的活動 DM</h3>
            <p id="empty-desc" class="text-gray-400 mt-2"></p>
        </div>
    </div>

    <!-- 引入 Firebase SDK (模組化設計) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // 🔧 步驟一：請在此填入您的 Firebase 設定檔
        // ==========================================
        const firebaseConfig = {
            apiKey: "這裡換成您的真實_API_KEY",
            authDomain: "這裡換成您的真實_AUTH_DOMAIN",
            projectId: "這裡換成您的真實_PROJECT_ID",
            storageBucket: "這裡換成您的真實_STORAGE_BUCKET",
            messagingSenderId: "這裡換成您的真實_MESSAGING_SENDER_ID",
            appId: "這裡換成您的真實_APP_ID"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 設定 GitHub 圖片資源基礎路徑
        const GITHUB_BASE_URL = "https://raw.githubusercontent.com/farmcmd/ESGT/main/images/";
        let dms = [];

        async function fetchDMs() {
            try {
                // 🌟 改由直接從 Firebase Firestore 抓取 dm_boards 集合的資料
                const q = query(collection(db, "dm_boards"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                dms = [];
                querySnapshot.forEach((doc) => {
                    dms.push({ id: doc.id, ...doc.data() });
                });
                
                renderNav();
            } catch (error) {
                console.error("無法載入看板資料:", error);
                showError("雲端資料庫連線失敗", "請確認 Firebase 設定檔是否正確，或是資料庫讀取權限是否開啟。");
            }
        }

        function renderNav() {
            const navContainer = document.getElementById('nav-container');
            const emptyState = document.getElementById('empty-state');
            const contentContainer = document.getElementById('content-container');

            if (dms.length === 0) {
                navContainer.innerHTML = '';
                contentContainer.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            contentContainer.classList.remove('hidden');

            navContainer.innerHTML = dms.map((dm, index) => `
                <button id="btn-${index}" class="tab-btn flex-shrink-0 px-5 py-2 rounded-full border border-green-200 bg-white text-green-700 font-semibold hover:bg-green-50 shadow-sm whitespace-nowrap">
                    ${dm.title || '未命名活動'}
                </button>
            `).join('');

            // 綁定點擊事件
            dms.forEach((_, index) => {
                document.getElementById(`btn-${index}`).addEventListener('click', () => selectDM(index));
            });

            // 預設選中第一筆
            selectDM(0);
        }

        function selectDM(index) {
            const dm = dms[index];
            if (!dm) return;

            // 更新按鈕視覺狀態
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${index}`).classList.add('active');

            // 組合 GitHub 圖檔完整網址
            const imageUrl = GITHUB_BASE_URL + dm.filename;

            // 更新畫面內容
            document.getElementById('display-image').src = imageUrl;
            document.getElementById('display-title').textContent = dm.title;
            document.getElementById('display-date-text').textContent = dm.date || '依公告為主';
            document.getElementById('display-info').textContent = dm.info || '無特殊備註說明。';
            
            const linkBtn = document.getElementById('display-link');
            if (dm.link) {
                linkBtn.href = dm.link;
                linkBtn.style.display = 'inline-block';
            } else {
                linkBtn.style.display = 'none';
            }
        }

        function showError(title, desc) {
            document.getElementById('nav-container').innerHTML = `<span class="text-red-500 font-bold px-3 py-1 bg-red-50 rounded">❌ ${title}</span>`;
            document.getElementById('content-container').classList.add('hidden');
            document.getElementById('empty-icon').textContent = "⚠️";
            document.getElementById('empty-title').textContent = title;
            document.getElementById('empty-desc').textContent = desc;
            document.getElementById('empty-state').classList.remove('hidden');
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', fetchDMs);
    </script>
</body>
</html>
