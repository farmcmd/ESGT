<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生態棲地小偵探 - 完整視野與自由佈置版</title>
    <style>
        :root {
            --primary-dark: #14532d;
            --primary-light: #22c55e;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #1f2937;
            --card-size: 55px;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111; /* 留白邊界的顏色 */
            touch-action: none;
            color: var(--text-dark);
        }

        /* 遊戲畫布：確保等比例縮放且不被裁切 */
        #canvas-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            max-width: 100%; 
            max-height: 100%;
            width: auto; 
            height: auto;
            background: #c5e1a5;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            /* 禁用原生反鋸齒，確保像素邊界清晰 */
            image-rendering: optimizeSpeed; 
        }

        /* 浮動按鈕與折疊面板共用樣式 */
        .floating-panel {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 600px;
            background: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .panel-header {
            padding: 12px 20px;
            font-weight: bold;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .panel-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            padding: 0 15px;
        }
        .floating-panel.open .panel-content {
            max-height: 300px;
            padding: 15px;
            overflow-y: auto;
            border-bottom-color: #e5e7eb;
        }

        /* 頂部：背包區域 */
        #top-panel { top: 15px; }
        
        .creature-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .creature-card {
            width: var(--card-size); height: var(--card-size);
            background: #ffffff; border: 2px solid #9ca3af;
            border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            touch-action: none; position: relative;
        }
        .c-icon { font-size: 26px; pointer-events: none; }
        .c-name { font-size: 11px; font-weight: bold; color: #4b5563; pointer-events: none; margin-top: -2px; }

        /* 底部：結算區域 */
        #bottom-panel { bottom: 15px; }
        .answer-box { font-size: 14px; line-height: 1.6; }
        .answer-box h4 { margin: 0 0 10px 0; color: #ea580c; border-bottom: 1px solid #ccc; padding-bottom: 5px;}
        .score-display { font-size: 24px; font-weight: bold; color: var(--primary-light); text-align: center; margin-top: 15px;}

        /* 啟動覆蓋層 */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 83, 45, 0.95); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        .start-box {
            background: white; color: var(--text-dark); padding: 30px; border-radius: 16px;
            text-align: center; width: 85%; max-width: 400px;
        }
        .start-box button {
            background: var(--primary-light); color: white; border: none; padding: 12px 30px;
            font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%;
        }

        /* 拖曳虛擬卡與系統提示 */
        #drag-clone {
            position: fixed; width: var(--card-size); height: var(--card-size);
            background: rgba(255, 255, 255, 1); border: 2px solid var(--primary-light);
            border-radius: 12px; display: none; flex-direction: column; align-items: center;
            justify-content: center; pointer-events: none; z-index: 1000;
            transform: translate(-50%, -50%); box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        #alert-box {
            position: fixed; top: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(234, 88, 12, 0.9); color: white; padding: 12px 25px;
            border-radius: 30px; font-size: 16px; font-weight: bold; pointer-events: none;
            opacity: 0; transition: opacity 0.3s; z-index: 2000; white-space: nowrap;
        }

        /* 左下角：陀螺儀方向指示儀 */
        #compass {
            position: absolute; bottom: 80px; left: 20px; width: 60px; height: 60px;
            background: rgba(255,255,255,0.7); border-radius: 50%; border: 3px solid #ccc;
            z-index: 50; display: flex; justify-content: center; align-items: center;
            pointer-events: none;
        }
        #compass-arrow {
            width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent;
            border-bottom: 20px solid #ef4444; transform: translateY(-10px); transition: transform 0.1s;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div class="start-box">
            <h2 style="color: var(--primary-dark); margin-top: 0;">生態棲地小偵探</h2>
            <p style="font-size: 14px; text-align: left; line-height: 1.5; color: #555;">
                <strong>🎮 體感操作說明：</strong><br>
                1. 📱 <b>方向調整</b>：手機平放，傾斜可轉動角色的面向。<br>
                2. 🚶 <b>身體走動</b>：手機感受走路微震動時，會自動前進！<br>
                3. 🎒 <b>自由佈局</b>：踩地雷收集卡牌，拖曳至地圖。<b>放錯隨時可從地圖上點選並拖回背包或轉移！</b>
            </p>
            <input type="text" id="player-name" placeholder="輸入偵探名稱" style="width:90%; padding:10px; font-size:16px; text-align:center; border:2px solid #ccc; border-radius:6px;">
            <button onclick="startGame()">允許感測並出發</button>
        </div>
    </div>

    <!-- 遊戲畫布：鎖定 1200x700 邏輯解析度 -->
    <div id="canvas-wrapper">
        <canvas id="gameCanvas" width="1200" height="700"></canvas>
    </div>

    <div id="compass"><div id="compass-arrow"></div></div>

    <!-- 頂部浮動：背包面板 -->
    <div id="top-panel" class="floating-panel">
        <div class="panel-header" onclick="togglePanel('top-panel')">
            <span>🎒 生態卡牌背包 (<span id="backpack-count">0</span>)</span>
            <span class="toggle-icon">▼</span>
        </div>
        <div class="panel-content">
            <div class="creature-container" id="creature-list">
                <div style="font-size: 13px; color: #888; width: 100%; text-align: center;">請走動探索，這裡會收集到隨機出現的生物卡牌。</div>
            </div>
        </div>
    </div>

    <!-- 底部浮動：結算面板 -->
    <div id="bottom-panel" class="floating-panel">
        <div class="panel-header" onclick="togglePanel('bottom-panel')">
            <span>📜 食物鏈解答與結算</span>
            <span class="toggle-icon">▲</span>
        </div>
        <div class="panel-content">
            <div class="answer-box">
                <h4>🎯 任務結算報告</h4>
                <div id="score-details">點擊下方按鈕結算您佈置的生態棲地分數！</div>
                <button onclick="calculateScore()" style="width: 100%; padding: 10px; margin-top: 10px; background: var(--primary-dark); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">立即結算分數</button>
                <div class="score-display" id="final-score"></div>
            </div>
        </div>
    </div>

    <!-- 拖曳與提示 -->
    <div id="drag-clone">
        <div class="c-icon" id="drag-icon"></div>
        <div class="c-name" id="drag-name"></div>
    </div>
    <div id="alert-box">提示訊息</div>

    <script>
        // --- 1. 生態數據庫 ---
        const ECO_DATA = [
            { id: 'c1', name: '石虎', icon: '🐆', validHabitats: ['h6', 'h12'] }, 
            { id: 'c2', name: '齧齒類', icon: '🐭', validHabitats: ['h1', 'h6', 'h5'] }, 
            { id: 'c3', name: '鼬獾', icon: '🦡', validHabitats: ['h6', 'h12'] }, 
            { id: 'c4', name: '蛇類', icon: '🐍', validHabitats: ['h2', 'h7'] }, 
            { id: 'c5', name: '龜類', icon: '🐢', validHabitats: ['h4', 'h8'] }, 
            { id: 'c6', name: '雉雞', icon: '🦚', validHabitats: ['h5', 'h6'] }, 
            { id: 'c7', name: '鳥類', icon: '🐦', validHabitats: ['h6'] }, 
            { id: 'c8', name: '昆蟲', icon: '🪲', validHabitats: ['h10', 'h1'] }, 
            { id: 'c9', name: '瓢蟲', icon: '🐞', validHabitats: ['h10', 'h6'] }, 
            { id: 'c10', name: '蚜蟲', icon: '🐛', validHabitats: ['h5'] }, 
            { id: 'c11', name: '螞蟻', icon: '🐜', validHabitats: ['h2', 'h5'] }, 
            { id: 'c12', name: '蛙類', icon: '🐸', validHabitats: ['h7', 'h4', 'h3'] }, 
            { id: 'c13', name: '金線蛙', icon: '🐸✨', validHabitats: ['h7', 'h4'] }, 
            { id: 'c14', name: '蝴蝶', icon: '🦋', validHabitats: ['h6', 'h5'] }, 
            { id: 'c15', name: '蜜蜂', icon: '🐝', validHabitats: ['h10', 'h6'] }, 
            { id: 'c16', name: '螳螂', icon: '🦗', validHabitats: ['h5', 'h6'] }, 
            { id: 'c17', name: '本土魚', icon: '🐟', validHabitats: ['h4', 'h9', 'h13'] }, 
            { id: 'c18', name: '大肚魚', icon: '🐠', validHabitats: ['h4', 'h13'] }, 
            { id: 'c19', name: '七星鯉', icon: '🐟✨', validHabitats: ['h4', 'h9'] }
        ];

        const FOOD_CHAINS = [
            { id: 'chain1', name: '田野捕食鏈 (蚜蟲➜瓢蟲➜鳥類)', members: ['c10', 'c9', 'c7'] }, 
            { id: 'chain2', name: '水岸生態鏈 (螞蟻➜蛙類➜蛇類)', members: ['c11', 'c12', 'c4'] }
        ];

        // 棲地陣列 (加入座標)
        const habitats = [
            { id: 'h1', name: '枯木草堆', x: 20, y: 150, w: 100, h: 60, occupants: [] },
            { id: 'h2', name: '石堆', x: 250, y: 80, w: 80, h: 50, occupants: [] },
            { id: 'h3', name: '砌石溝', x: 450, y: 580, w: 120, h: 40, occupants: [] },
            { id: 'h4', name: '水塘', x: 880, y: 550, w: 180, h: 100, occupants: [] },
            { id: 'h5', name: '田埂草帶', x: 200, y: 350, w: 250, h: 40, occupants: [] },
            { id: 'h6', name: '灌木欉', x: 1050, y: 150, w: 100, h: 80, occupants: [] },
            { id: 'h7', name: '濕地', x: 1000, y: 350, w: 150, h: 120, occupants: [] },
            { id: 'h8', name: '護岸', x: 820, y: 300, w: 40, h: 200, occupants: [] },
            { id: 'h9', name: '漂浮草帶', x: 920, y: 580, w: 80, h: 40, occupants: [] },
            { id: 'h10', name: '昆蟲旅館', x: 620, y: 380, w: 60, h: 60, occupants: [] },
            { id: 'h11', name: '攀爬網', x: 700, y: 250, w: 80, h: 30, occupants: [] },
            { id: 'h12', name: '涵洞護道', x: 400, y: 240, w: 100, h: 40, occupants: [] },
            { id: 'h13', name: '深溝護道', x: 60, y: 550, w: 50, h: 120, occupants: [] }
        ];

        let inventory = []; 

        // --- 2. 核心狀態與 Canvas 初始化 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const LOGICAL_W = 1200;
        const LOGICAL_H = 700;
        
        let isGameRunning = false;
        let playerName = "";
        let distanceTraveled = 0;
        
        let player = {
            x: LOGICAL_W - 80, 
            y: 100, 
            dirAngle: 0, 
            size: 28, 
            icon: '🕵️' 
        };

        // --- 3. UI 面板操作 ---
        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            const icon = panel.querySelector('.toggle-icon');
            if (panel.classList.contains('open')) {
                panel.classList.remove('open');
                icon.innerText = panelId === 'top-panel' ? '▼' : '▲';
            } else {
                document.querySelectorAll('.floating-panel').forEach(p => {
                    p.classList.remove('open');
                    if(p.id === 'top-panel') p.querySelector('.toggle-icon').innerText = '▼';
                    if(p.id === 'bottom-panel') p.querySelector('.toggle-icon').innerText = '▲';
                });
                panel.classList.add('open');
                icon.innerText = '✖';
            }
        }

        function showAlert(msg) {
            const box = document.getElementById('alert-box');
            box.innerText = msg;
            box.style.opacity = 1;
            setTimeout(() => box.style.opacity = 0, 2500);
        }

        // --- 4. 體感感測與啟動 ---
        async function startGame() {
            playerName = document.getElementById('player-name').value || '小偵探';
            
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    let p1 = await DeviceOrientationEvent.requestPermission();
                    let p2 = typeof DeviceMotionEvent !== 'undefined' ? await DeviceMotionEvent.requestPermission() : 'granted';
                    if (p1 === 'granted' && p2 === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        window.addEventListener('devicemotion', handleMotion);
                    } else {
                        alert('已啟用鍵盤方向鍵備用操作。');
                    }
                } catch (e) { console.error(e); }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                window.addEventListener('devicemotion', handleMotion);
            }

            // 鍵盤備用
            window.addEventListener('keydown', (e) => {
                const speed = 10;
                if(e.key==='ArrowUp') {
                    player.x += Math.sin(player.dirAngle) * speed;
                    player.y -= Math.cos(player.dirAngle) * speed;
                    checkMovement(speed);
                }
                if(e.key==='ArrowLeft') player.dirAngle -= 0.2;
                if(e.key==='ArrowRight') player.dirAngle += 0.2;
            });

            document.getElementById('start-overlay').style.display = 'none';
            isGameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function handleOrientation(e) {
            if (!isGameRunning) return;
            let dx = e.gamma || 0; 
            let dy = e.beta || 0;  
            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
                player.dirAngle = Math.atan2(dx, -dy);
            }
            document.getElementById('compass-arrow').style.transform = `translateY(-10px) rotate(${player.dirAngle}rad)`;
        }

        function handleMotion(e) {
            if (!isGameRunning) return;
            let acc = e.acceleration || {x:0, y:0, z:0};
            let mag = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
            
            if (mag > 2.0) {
                const stepSize = 4;
                player.x += Math.sin(player.dirAngle) * stepSize;
                player.y -= Math.cos(player.dirAngle) * stepSize; 
                
                player.x = Math.max(player.size, Math.min(LOGICAL_W - player.size, player.x));
                player.y = Math.max(player.size, Math.min(LOGICAL_H - player.size, player.y));

                checkMovement(stepSize);
            }
        }

        function checkMovement(dist) {
            distanceTraveled += dist;
            if (distanceTraveled > 150) { 
                distanceTraveled = 0;
                if (Math.random() < 0.20) triggerEncounter();
            }
        }

        function triggerEncounter() {
            let randomTemplate = ECO_DATA[Math.floor(Math.random() * ECO_DATA.length)];
            let instance = { ...randomTemplate, uniqueId: 'inst_' + Date.now() + Math.floor(Math.random()*1000) };
            inventory.push(instance);
            
            renderInventory();
            showAlert(`👣 踩到生態地雷！發現了【${instance.name}】！`);
            
            const panel = document.getElementById('top-panel');
            if (!panel.classList.contains('open')) {
                panel.style.borderColor = "var(--primary-light)";
                setTimeout(()=> panel.style.borderColor = "rgba(255,255,255,0.5)", 500);
            }
        }

        function renderInventory() {
            const container = document.getElementById('creature-list');
            document.getElementById('backpack-count').innerText = inventory.length;

            if (inventory.length === 0) {
                container.innerHTML = `<div style="font-size: 13px; color: #888; width: 100%; text-align: center;">背包空空如也，請繼續走動探索！</div>`;
                return;
            }
            
            container.innerHTML = '';
            inventory.forEach(c => {
                const div = document.createElement('div');
                div.className = 'creature-card';
                div.id = c.uniqueId;
                div.innerHTML = `<div class="c-icon">${c.icon}</div><div class="c-name">${c.name}</div>`;
                div.addEventListener('pointerdown', (e) => handleDragStart(e, c, div));
                container.appendChild(div);
            });
        }

        // --- 6. 進階拖曳機制 (支援從 Canvas 反向拖曳) ---
        let draggingInstance = null;
        const dragClone = document.getElementById('drag-clone');

        function getLogicalCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        // 監聽 Canvas 上點擊已放置的生物
        canvas.addEventListener('pointerdown', (e) => {
            const coords = getLogicalCoords(e);
            
            for (let h of habitats) {
                if (h.occupants.length > 0) {
                    for (let i = h.occupants.length - 1; i >= 0; i--) {
                        let occ = h.occupants[i];
                        if (occ.renderBox && 
                            coords.x >= occ.renderBox.x && coords.x <= occ.renderBox.x + occ.renderBox.w &&
                            coords.y >= occ.renderBox.y && coords.y <= occ.renderBox.y + occ.renderBox.h) {
                            
                            // 成功抓取！從棲地中移除並進入拖曳狀態
                            draggingInstance = occ;
                            h.occupants.splice(i, 1);
                            
                            dragClone.style.display = 'flex';
                            dragClone.querySelector('#drag-icon').innerText = occ.icon;
                            dragClone.querySelector('#drag-name').innerText = occ.name;
                            moveDragClone(e);
                            
                            document.addEventListener('pointermove', handleDragMove);
                            document.addEventListener('pointerup', handleDragEnd);
                            e.preventDefault();
                            return; // 找到一個就停止
                        }
                    }
                }
            }
        });

        // 監聽 HTML 背包內的卡牌拖曳
        function handleDragStart(e, instance, el) {
            draggingInstance = instance;
            dragClone.style.display = 'flex';
            dragClone.querySelector('#drag-icon').innerText = instance.icon;
            dragClone.querySelector('#drag-name').innerText = instance.name;
            moveDragClone(e);
            
            document.addEventListener('pointermove', handleDragMove);
            document.addEventListener('pointerup', handleDragEnd);
            e.preventDefault();
        }

        function handleDragMove(e) {
            if (!draggingInstance) return;
            moveDragClone(e);
        }
        
        function moveDragClone(e) {
            dragClone.style.left = e.clientX + 'px';
            dragClone.style.top = e.clientY + 'px';
        }

        function handleDragEnd(e) {
            if (!draggingInstance) return;
            document.removeEventListener('pointermove', handleDragMove);
            document.removeEventListener('pointerup', handleDragEnd);
            dragClone.style.display = 'none';

            const coords = getLogicalCoords(e);

            // 檢查是否掉落在棲地上
            let droppedHabitat = habitats.find(h => coords.x >= h.x && coords.x <= h.x + h.w && coords.y >= h.y && coords.y <= h.y + h.h);

            if (droppedHabitat) {
                droppedHabitat.occupants.push(draggingInstance);
                inventory = inventory.filter(i => i.uniqueId !== draggingInstance.uniqueId);
                showAlert(`已將【${draggingInstance.name}】安置於【${droppedHabitat.name}】。`);
            } else {
                // 如果沒有掉在任何棲地上，退回背包
                if (!inventory.find(i => i.uniqueId === draggingInstance.uniqueId)) {
                    inventory.push(draggingInstance);
                }
                showAlert(`【${draggingInstance.name}】已退回背包。`);
            }
            
            renderInventory();
            draggingInstance = null;
        }

        // --- 7. 結算系統 ---
        function calculateScore() {
            let totalScore = 0;
            let logHTML = "<ul style='padding-left: 20px; color: #4b5563;'>";
            let successfullyPlacedIds = new Set();

            habitats.forEach(h => {
                h.occupants.forEach(occ => {
                    if (occ.validHabitats.includes(h.id)) {
                        totalScore += 1;
                        successfullyPlacedIds.add(occ.id); 
                        logHTML += `<li><span style="color:green">✔</span> ${occ.name} 在 ${h.name} 適應良好 (+1)</li>`;
                    } else {
                        logHTML += `<li><span style="color:red">✖</span> ${occ.name} 不太適應 ${h.name} (無加分)</li>`;
                    }
                });
            });

            FOOD_CHAINS.forEach(chain => {
                let isCompleted = chain.members.every(mId => successfullyPlacedIds.has(mId));
                if (isCompleted) {
                    totalScore += 10;
                    logHTML += `<li><strong style="color:#ea580c">⭐ 達成 ${chain.name} 完整鏈條 (+10)</strong></li>`;
                }
            });

            logHTML += "</ul>";
            document.getElementById('score-details').innerHTML = logHTML;
            document.getElementById('final-score').innerText = `🏆 總成績：${totalScore} 分`;
        }

        // --- 8. Canvas 渲染迴圈 ---
        function gameLoop() {
            if (!isGameRunning) return;
            drawMap();
            drawHabitats();
            drawPlayer();
            requestAnimationFrame(gameLoop);
        }

        function drawMap() {
            ctx.fillStyle = '#c5e1a5'; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
            
            ctx.fillStyle = '#2e7d32'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(300,0); ctx.lineTo(250,250); ctx.lineTo(0,250); ctx.fill(); drawTextBg('森林', 100, 100, '#1b5e20');
            ctx.fillStyle = '#558b2f'; ctx.beginPath(); ctx.moveTo(300,0); ctx.lineTo(800,0); ctx.quadraticCurveTo(850,150,750,250); ctx.lineTo(250,250); ctx.fill(); drawTextBg('淺山', 500, 100, '#33691e');
            ctx.fillStyle = '#757575'; ctx.fillRect(0, 250, LOGICAL_W, 60); drawTextBg('山邊道路', 150, 280, '#424242');
            ctx.fillStyle = '#424242'; ctx.fillRect(430, 240, 40, 80); drawTextBg('涵洞', 450, 280, '#212121');
            ctx.fillStyle = '#4fc3f7'; ctx.beginPath(); ctx.moveTo(850, 310); ctx.lineTo(950, 310); ctx.lineTo(1050, LOGICAL_H); ctx.lineTo(950, LOGICAL_H); ctx.fill(); drawTextBg('溪流', 930, 450, '#0277bd');
            ctx.fillStyle = '#fff59d'; ctx.fillRect(150, 350, 350, 180); drawTextBg('農田', 320, 440, '#f57f17');
            ctx.fillStyle = '#29b6f6'; ctx.beginPath(); ctx.ellipse(970, 600, 120, 70, 0, 0, Math.PI * 2); ctx.fill(); drawTextBg('水塘', 970, 600, '#0277bd');
        }

        function drawHabitats() {
            const iconSize = 34; // 擴大生物卡牌在畫布上的顯示尺寸
            const padding = 5;

            habitats.forEach(h => {
                ctx.save();
                ctx.lineWidth = 2;
                
                if (h.occupants.length > 0) {
                    ctx.strokeStyle = '#4caf50';
                    ctx.fillStyle = 'rgba(76, 175, 80, 0.2)';
                    ctx.setLineDash([]);
                } else {
                    ctx.strokeStyle = 'rgba(244, 67, 54, 0.6)';
                    ctx.fillStyle = 'rgba(244, 67, 54, 0.1)';
                    ctx.setLineDash([5, 5]);
                }

                ctx.beginPath(); ctx.roundRect(h.x, h.y, h.w, h.h, 4);
                ctx.fill(); ctx.stroke();
                
                if (h.occupants.length > 0) {
                    // 精確計算網格，保證不重疊
                    const maxCols = Math.max(1, Math.floor((h.w - padding * 2) / iconSize));
                    
                    ctx.textAlign = 'center'; 
                    ctx.textBaseline = 'middle';
                    
                    h.occupants.forEach((occ, index) => {
                        let col = index % maxCols;
                        let row = Math.floor(index / maxCols);
                        let px = h.x + padding + col * iconSize + iconSize/2;
                        let py = h.y + padding + row * iconSize + iconSize/2;
                        
                        // 繪製白色不透明底框
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                        ctx.fillRect(px - iconSize/2 + 2, py - iconSize/2 + 2, iconSize - 4, iconSize - 4);
                        ctx.strokeStyle = '#9ca3af';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(px - iconSize/2 + 2, py - iconSize/2 + 2, iconSize - 4, iconSize - 4);

                        // 繪製 Emoji
                        ctx.font = '24px Arial';
                        ctx.fillStyle = '#000';
                        ctx.fillText(occ.icon, px, py + 2);

                        // 儲存實際碰撞框，供後續點擊拖曳判定
                        occ.renderBox = {
                            x: px - iconSize/2 + 2,
                            y: py - iconSize/2 + 2,
                            w: iconSize - 4,
                            h: iconSize - 4
                        };
                    });
                } else {
                    ctx.font = '12px Arial'; ctx.fillStyle = '#b71c1c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(h.name, h.x + h.w/2, h.y + h.h/2);
                }
                ctx.restore();
            });
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            
            ctx.font = `${player.size}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.rotate(player.dirAngle);
            ctx.fillText(player.icon, 0, 0);

            // 前方紅點指示器
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.arc(0, -22, 4, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
            ctx.fillStyle = '#111'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.fillText(playerName, player.x, player.y + 25);
        }

        function drawTextBg(text, x, y, bgColor) {
            ctx.fillStyle = bgColor; ctx.font = '12px Arial';
            const w = ctx.measureText(text).width + 10;
            ctx.beginPath(); ctx.roundRect(x - w/2, y - 8, w, 16, 4); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y);
        }

    </script>
