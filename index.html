<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>探探里山 - 永續廊道多點行程規劃 (測試畫布)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入必要的套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f4f7f6; scroll-behavior: smooth; }
        .mori-gradient { background: linear-gradient(135deg, #2E7D32 0%, #4CAF50 100%); }
        .glass-panel { background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(8px); transition: all 0.3s ease; }
        .glass-panel:hover { background: rgba(255, 255, 255, 0.85); }
        .hidden { display: none !important; }
        .bounce-arrow { animation: bounce 2s infinite; }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800">

    <header class="mori-gradient text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-leaf"></i> 探探里山永續基地
            </h1>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 flex flex-col gap-6 mt-4">
        
        <!-- 頂部區塊：專案活動列表 -->
        <div id="project-list-section" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden scroll-mt-20">
            <div class="bg-gradient-to-r from-amber-500 to-orange-400 p-3 text-white font-bold flex items-center justify-between shadow-inner">
                <div class="flex items-center gap-2 text-lg">
                    <i class="fas fa-crown text-yellow-200"></i>
                    <span>企業/團體永續專案活動</span>
                </div>
                <div class="bounce-arrow text-yellow-100 text-sm flex items-center gap-1">
                    由此處加入行程 <i class="fas fa-hand-point-down"></i>
                </div>
            </div>
            
            <div id="poi-groups-container" class="p-4 bg-orange-50/50 min-h-[100px]">
                <div class="text-center text-gray-400 py-4"><i class="fas fa-spinner fa-spin"></i> 載入專案中...</div>
            </div>
        </div>

        <!-- 交通工具選擇區 (為展示捲動功能，故意拉開空間) -->
        <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-200 mt-10">
            <h3 class="font-bold text-gray-800 mb-3"><i class="fas fa-car text-blue-500"></i> 請選擇交通方式</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <button onclick="selectTransport('walk')" class="p-2 border rounded hover:bg-green-50">🚶 步行/自行車</button>
                <button onclick="selectTransport('transit')" class="p-2 border rounded hover:bg-blue-50">🚌 大眾運輸</button>
                <button onclick="selectTransport('carpool')" class="p-2 border border-blue-400 bg-blue-50 rounded shadow-sm font-bold text-blue-700">🚗 2人共乘(汽車)</button>
                <button onclick="selectTransport('car')" class="p-2 border rounded hover:bg-gray-50">🚙 單人自駕</button>
            </div>
        </div>

        <!-- 地圖與浮動面板區 -->
        <div class="relative w-full h-[600px] rounded-xl overflow-hidden shadow-md border border-gray-300 bg-blue-50 flex items-center justify-center mt-10" id="map-container">
            <div class="text-gray-400 text-xl font-bold opacity-50 flex flex-col items-center gap-2">
                <i class="fas fa-map-marked-alt text-6xl"></i>
                <p>Google Maps 載入區</p>
            </div>

            <div class="absolute top-4 right-4 z-10 w-80 glass-panel rounded-lg shadow-xl border border-white/40 flex flex-col max-h-[90%]">
                <div class="p-3 cursor-pointer flex justify-between items-center border-b border-gray-200/50" onclick="toggleRoutePanel()">
                    <h3 class="font-bold text-gray-800 text-[14px] drop-shadow-sm flex items-center gap-2">
                        <i class="fas fa-route text-blue-600"></i> 加入「多點」行程計算
                    </h3>
                    <i id="route-chevron" class="fas fa-chevron-down text-gray-600 transition-transform duration-300"></i>
                </div>
                
                <div id="route-points-wrapper" class="p-3 flex flex-col gap-2 overflow-y-auto no-scrollbar">
                    <div class="text-[11px] text-gray-600 bg-white/60 p-2 rounded drop-shadow-sm mb-1">
                        <i class="fas fa-info-circle"></i> 請從上方「專案活動」中，依序選擇地點加入路線 (上限 10 點)
                    </div>
                    
                    <ul id="route-points-list" class="flex flex-col gap-2 text-[12px]"></ul>

                    <div id="route-actions" class="mt-2 flex flex-col gap-2 hidden">
                        <button onclick="addReturnToStart()" class="w-full py-1.5 text-[12px] bg-white border border-blue-300 text-blue-600 rounded hover:bg-blue-50 transition">
                            <i class="fas fa-rotate-left"></i> 加入起點 (形成環線)
                        </button>
                        <button onclick="calculateMultiStopRoute()" class="w-full py-2 text-[13px] bg-blue-600 text-white font-bold rounded shadow-md hover:bg-blue-700 transition">
                            <i class="fas fa-calculator"></i> 開始計算路線
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div style="height: 50vh;"></div> <!-- 墊高網頁，方便測試往下捲動的效果 -->

    </main>

    <div id="itinerary-card-container" class="fixed top-[-9999px] left-[-9999px] w-[400px] bg-white rounded-xl p-6 shadow-2xl z-[-1]"></div>

    <script>
        window.routePoints = [];

        function showToast(msg) { alert(msg); }

        function selectTransport(type) {
            let msg = "已選擇交通工具";
            if(type === 'carpool') msg = "🚗 已選擇 2人共乘(汽車)！碳排量將依共乘比例折算。";
            showToast(msg);
            document.getElementById('project-list-section').scrollIntoView({ behavior: 'smooth' });
        }

        function toggleRoutePanel() {
            const wrapper = document.getElementById('route-points-wrapper');
            const chevron = document.getElementById('route-chevron');
            wrapper.classList.toggle('hidden');
            chevron.style.transform = wrapper.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        function addPointToRoute(poi) {
            if (window.routePoints.length >= 10) return showToast('最多只能加入 10 個站點！');
            window.routePoints.push(poi);
            renderRoutePoints();
            const wrapper = document.getElementById('route-points-wrapper');
            if(wrapper.classList.contains('hidden')) toggleRoutePanel();
        }

        function removePointFromRoute(index) {
            window.routePoints.splice(index, 1);
            renderRoutePoints();
        }

        function addReturnToStart() {
            if(window.routePoints.length >= 2) {
                const startPoint = Object.assign({}, window.routePoints[0]);
                startPoint.name = startPoint.name + " (回程)";
                addPointToRoute(startPoint);
            }
        }

        function renderRoutePoints() {
            const list = document.getElementById('route-points-list');
            const actions = document.getElementById('route-actions');
            list.innerHTML = '';
            
            if (window.routePoints.length === 0) {
                actions.classList.add('hidden');
                return;
            }

            window.routePoints.forEach((point, index) => {
                let badge = `<span class="bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full text-[10px] mr-2">${index + 1}</span>`;
                if (index === 0) badge = `<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-[10px] mr-2">起</span>`;
                else if (index === window.routePoints.length - 1 && window.routePoints.length > 1) {
                    badge = `<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded-full text-[10px] mr-2">終</span>`;
                }

                list.innerHTML += `
                    <li class="flex items-center justify-between bg-white border border-gray-200 p-2 rounded shadow-sm">
                        <div class="flex items-center overflow-hidden whitespace-nowrap overflow-ellipsis">
                            ${badge}
                            <span class="font-bold text-gray-700 truncate" title="${point.name}">${point.name}</span>
                        </div>
                        <button onclick="removePointFromRoute(${index})" class="text-red-400 hover:text-red-600 ml-2"><i class="fas fa-times"></i></button>
                    </li>
                `;
            });
            actions.classList.toggle('hidden', window.routePoints.length < 2);
        }

        function calculateMultiStopRoute() {
            if(window.routePoints.length < 2) return showToast("請至少加入兩個站點");
            showToast("✅ 路線計算完成！總長度預估：" + (window.routePoints.length * 15) + " km");
            toggleRoutePanel(); 
        }

        // ==========================================
        // ⭐ 1. 產生分享網址
        // ==========================================
        function shareItinerary(groupId) {
            const baseUrl = window.location.origin + window.location.pathname;
            const shareUrl = `${baseUrl}?project_id=${groupId}`;
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast('✅ 專屬行程網址已複製！');
                }).catch(() => { prompt('請手動複製網址：', shareUrl); });
            } else {
                prompt('請手動複製網址：', shareUrl);
            }
        }

        // ==========================================
        // ⭐ 2. 測試專用的 Deep Link 觸發器 (畫布專用)
        // ==========================================
        function simulateDeepLinkTest(groupId) {
            // 先把所有手風琴關閉，以展示自動展開效果
            document.querySelectorAll('[id^="poi-content-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="poi-arrow-"]').forEach(el => el.style.transform = 'rotate(0deg)');
            
            // 將網址推入歷史紀錄，模擬帶有參數的狀態
            const testUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?project_id=' + groupId;
            window.history.pushState({path: testUrl}, '', testUrl);
            
            showToast('🔄 模擬朋友點擊網址進入...');
            
            // 執行真正的定位邏輯
            setTimeout(checkAndScrollToSharedProject, 300);
        }

        // ==========================================
        // ⭐ 3. 解析網址並定位的真正邏輯
        // ==========================================
        function checkAndScrollToSharedProject() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('project_id');
            
            if (targetId) {
                const targetElement = document.getElementById(`poi-group-${targetId}`);
                const contentArea = document.getElementById(`poi-content-${targetId}`);
                const arrowIcon = document.getElementById(`poi-arrow-${targetId}`);
                
                if (targetElement) {
                    // 1. 打開該摺疊區塊
                    if (contentArea && contentArea.classList.contains('hidden')) {
                        contentArea.classList.remove('hidden');
                        if(arrowIcon) arrowIcon.style.transform = 'rotate(180deg)';
                    }
                    
                    // 2. 平滑捲動過去
                    setTimeout(() => {
                        // 使用 scrollIntoView 並留出上方邊距
                        targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        
                        // 3. 亮起黃色光圈特效
                        targetElement.classList.add('ring-4', 'ring-yellow-400', 'transition-all', 'duration-500');
                        setTimeout(() => targetElement.classList.remove('ring-4', 'ring-yellow-400'), 3000);
                    }, 500);
                }
            }
        }

        function downloadItineraryCard(groupId) {
            const groupEl = document.getElementById(`poi-group-${groupId}`);
            if(!groupEl) return showToast('找不到資料');
            
            const title = groupEl.getAttribute('data-title');
            const pois = JSON.parse(groupEl.getAttribute('data-pois') || "[]");
            if(pois.length === 0) return showToast("無站點可打包");

            showToast("🎨 正在為您繪製圖卡，請稍候...");
            const container = document.getElementById('itinerary-card-container');
            
            let cardHtml = `
                <div class="bg-gradient-to-br from-green-50 to-white p-6 border-4 border-green-600 rounded-xl relative">
                    <div class="text-center mb-6">
                        <div class="inline-block bg-green-600 text-white px-4 py-1 rounded-full text-sm font-bold mb-2">永續旅行專案</div>
                        <h2 class="text-2xl font-bold text-gray-800">${title}</h2>
                    </div>
                    <div class="relative border-l-2 border-green-300 ml-4 mb-6">
            `;
            
            pois.forEach((poi, idx) => {
                cardHtml += `
                    <div class="mb-4 ml-6 relative">
                        <div class="absolute -left-[35px] top-0 bg-green-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border-2 border-white">${idx + 1}</div>
                        <h4 class="font-bold text-gray-800 text-lg">${poi.name}</h4>
                    </div>
                `;
            });
            
            cardHtml += `
                    </div>
                    <div class="mt-6 pt-4 border-t border-green-200 flex items-center justify-between">
                        <div>
                            <div class="font-bold text-green-700 text-lg"><i class="fas fa-leaf"></i> 探探里山永續基地</div>
                            <div class="text-xs text-gray-500 mt-1">掃描右方條碼，立即啟程！</div>
                        </div>
                        <div id="card-qrcode-${groupId}" class="bg-white p-1 rounded shadow-sm"></div>
                    </div>
                </div>
            `;
            
            container.innerHTML = cardHtml;
            
            new QRCode(document.getElementById(`card-qrcode-${groupId}`), {
                text: `${window.location.origin}${window.location.pathname}?project_id=${groupId}`,
                width: 70, height: 70, colorDark : "#166534", colorLight : "#ffffff"
            });

            setTimeout(() => {
                html2canvas(container, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `${title}_行程圖卡.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                    container.innerHTML = '';
                });
            }, 500);
        }

        function loadPoiGroups() {
            const container = document.getElementById('poi-groups-container');
            const mockData = [
                { id: "proj_001", title: "水里里山生態廊道體驗", pois: [{name: "水里火車站"}, {name: "車埕木業館"}, {name: "秘密花園"}] },
                { id: "proj_002", title: "台大實驗林木育之旅", pois: [{name: "明潭水庫"}, {name: "大觀發電廠"}, {name: "二坪冰店"}] }
            ];

            let html = '';
            mockData.forEach(group => {
                const poisJson = JSON.stringify(group.pois).replace(/"/g, '&quot;');
                html += `
                <div id="poi-group-${group.id}" data-title="${group.title}" data-pois="${poisJson}" class="mb-3 bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden scroll-mt-24">
                    <div class="p-3 bg-gray-50 flex justify-between items-center cursor-pointer hover:bg-gray-100" onclick="document.getElementById('poi-content-${group.id}').classList.toggle('hidden'); document.getElementById('poi-arrow-${group.id}').classList.toggle('rotate-180');">
                        <div class="font-bold text-gray-800 text-[15px]">${group.title}</div>
                        <i id="poi-arrow-${group.id}" class="fas fa-chevron-down text-gray-500 transition-transform duration-300"></i>
                    </div>
                    <div id="poi-content-${group.id}" class="hidden flex flex-col">
                        <div class="p-3 grid grid-cols-1 gap-2">
                `;
                
                group.pois.forEach(poi => {
                    const poiStr = JSON.stringify(poi).replace(/"/g, '&quot;');
                    html += `
                        <button onclick="addPointToRoute(JSON.parse('${poiStr}'))" class="text-left w-full p-2 border border-blue-100 rounded bg-white hover:bg-blue-50 transition text-[14px] flex justify-between">
                            <span class="font-bold text-gray-700">${poi.name}</span>
                            <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded">加入路線</span>
                        </button>
                    `;
                });

                html += `</div>
                    <!-- 按鈕區塊 -->
                    <div class="p-3 bg-white border-t border-gray-100 flex flex-wrap gap-2 justify-center">
                        <button onclick="downloadItineraryCard('${group.id}')" class="flex-1 min-w-[100px] bg-green-600 hover:bg-green-700 text-white text-[12px] font-bold py-2 rounded-lg flex items-center justify-center gap-1 shadow-sm">
                            <i class="fas fa-images"></i> 打包圖卡
                        </button>
                        <button onclick="shareItinerary('${group.id}')" class="flex-1 min-w-[100px] bg-blue-600 hover:bg-blue-700 text-white text-[12px] font-bold py-2 rounded-lg flex items-center justify-center gap-1 shadow-sm">
                            <i class="fas fa-link"></i> 分享網址
                        </button>
                        <!-- 畫布專用的測試定位按鈕 -->
                        <button onclick="simulateDeepLinkTest('${group.id}')" class="flex-1 min-w-[100px] bg-purple-600 hover:bg-purple-700 text-white text-[12px] font-bold py-2 rounded-lg flex items-center justify-center gap-1 shadow-sm">
                            <i class="fas fa-bullseye"></i> 🎯測試定位
                        </button>
                    </div>
                </div></div>`;
            });

            container.innerHTML = html;
            
            // 初次載入檢查網址參數
            setTimeout(checkAndScrollToSharedProject, 500);
        }

        window.onload = loadPoiGroups;
    </script>
</body>
</html>
