    <script type="module">
        window.hasHandledDeepLink = false;

        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, serverTimestamp, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

        // Firebase 設定
        const firebaseConfig = { apiKey: "AIzaSyCEH65YbNirj_IRmtsIJZS-HNEbsRBBsSQ", authDomain: "sustainable-tourism-65025.firebaseapp.com", projectId: "sustainable-tourism-65025" };
        let db = null, auth = null;
        
        // 狀態管理 
        window.currentEventsList = [];
        let globalEventRegistrations = {};
        window.isRegSnapshotLoaded = false;
        window.expandedRegEvents = new Set();

        // 通用工具函數
        window.toastTimer = null;
        window.showToast = function(msg) {
            let toast = document.getElementById('custom-toast');
            if(toast) { 
                toast.textContent = msg; toast.classList.add('show'); 
                if(window.toastTimer) clearTimeout(window.toastTimer);
                window.toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 3000); 
            }
        };

        window.openModal = function(modalId) { document.getElementById(modalId)?.classList.remove('hidden'); };
        window.closeModal = function(modalId) { document.getElementById(modalId)?.classList.add('hidden'); };

        // 雙重智慧分享引擎
        window.currentShareData = { url: '', title: '', text: '' };

        window.shareSpecificEvent = function(encodedEventName) {
            try {
                const eventName = decodeURIComponent(encodedEventName); 
                const url = new URL(window.location.href); 
                url.hash = ''; 
                url.searchParams.set('event', eventName);
                const finalUrl = url.toString(); 
                
                const shareTitle = `探探里山活動：${eventName}`;
                const shareText = `🔗 邀請您一起參加【${eventName}】！\n點擊專屬連結直接查看活動詳情與報名資訊👇`;

                window.currentShareData = { url: finalUrl, title: shareTitle, text: shareText };

                const ua = navigator.userAgent || navigator.vendor || window.opera;
                const isInAppBrowser = (ua.indexOf('Line') > -1) || (ua.indexOf('FBAN') > -1) || (ua.indexOf('FBAV') > -1);

                if (navigator.share && !isInAppBrowser) {
                    navigator.share({
                        title: shareTitle,
                        text: shareText,
                        url: finalUrl,
                    }).then(() => {
                        window.showToast('✅ 活動分享成功！');
                    }).catch((err) => {
                        console.warn('原生分享失敗或取消:', err);
                        if (err.name !== 'AbortError') { window.openModal('share-event-modal'); }
                    });
                } else {
                    window.openModal('share-event-modal');
                }
            } catch(e) {
                console.error("分享準備過程發生錯誤", e);
                window.openModal('share-event-modal'); 
            }
        };

        // 綁定自訂社群分享視窗的按鈕事件
        document.getElementById('share-line-btn')?.addEventListener('click', () => {
            const { url, text } = window.currentShareData;
            window.open(`https://line.me/R/msg/text/?${encodeURIComponent(text + '\n' + url)}`, '_blank');
            window.closeModal('share-event-modal');
        });
        document.getElementById('share-fb-btn')?.addEventListener('click', () => {
            const { url } = window.currentShareData;
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank');
            window.closeModal('share-event-modal');
        });
        document.getElementById('share-x-btn')?.addEventListener('click', () => {
            const { url, text } = window.currentShareData;
            window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`, '_blank');
            window.closeModal('share-event-modal');
        });
        document.getElementById('share-copy-btn')?.addEventListener('click', () => {
            const { url } = window.currentShareData;
            const textArea = document.createElement("textarea"); textArea.value = url; textArea.style.position = "fixed"; textArea.style.left = "-9999px";
            document.body.appendChild(textArea); textArea.focus(); textArea.select();
            try { document.execCommand('copy'); window.showToast('🔗 專屬連結已複製！'); } catch (err) { window.prompt("請手動複製網址：", url); } document.body.removeChild(textArea);
            window.closeModal('share-event-modal');
        });

        // 極速展開名單邏輯
        window.toggleRegList = function(eventName) {
            if (window.expandedRegEvents.has(eventName)) {
                window.expandedRegEvents.delete(eventName);
            } else {
                window.expandedRegEvents.add(eventName);
            }
            if(typeof window.renderEventsListUI === 'function') window.renderEventsListUI();
        };

        // 獨立卡片渲染引擎
        window.renderEventsListUI = function() {
            const container = document.getElementById('event-schedule-container');
            if (!window.currentEventsList || window.currentEventsList.length === 0) {
                if(container) container.innerHTML = '<div class="col-span-full py-12 text-center text-gray-400 border-2 border-dashed border-gray-200 rounded-xl"><i class="fas fa-calendar-times text-4xl mb-3 opacity-50"></i><p class="font-bold tracking-widest">目前尚無近期活動，敬請留意。</p></div>'; 
                return;
            }
            
            const today = new Date(); today.setHours(0,0,0,0);
            const processedEvents = [...window.currentEventsList].map(ev => { let isExpired = false; if(ev.date) { const evDate = new Date(ev.date.replace(/-/g, '/')); if(!isNaN(evDate) && evDate < today) isExpired = true; } return { ...ev, isExpired }; }).sort((a, b) => { if (a.isExpired === b.isExpired) return 0; return a.isExpired ? 1 : -1; });

            const html = processedEvents.map(ev => {
                let isExpired = ev.isExpired, calendarUrl = '#';
                const safeEventName = encodeURIComponent(ev.name).replace(/'/g, "%27");

                if(ev.date && !isExpired) {
                    try {
                        const evDate = new Date(ev.date.replace(/-/g, '/'));
                        if(!isNaN(evDate)) {
                            const y1 = evDate.getFullYear(), m1 = String(evDate.getMonth()+1).padStart(2,'0'), d1 = String(evDate.getDate()).padStart(2,'0');
                            const nextDate = new Date(evDate); nextDate.setDate(nextDate.getDate() + 1);
                            const y2 = nextDate.getFullYear(), m2 = String(nextDate.getMonth()+1).padStart(2,'0'), d2 = String(nextDate.getDate()).padStart(2,'0');
                            const dates = `${y1}${m1}${d1}/${y2}${m2}${d2}`, title = encodeURIComponent(`探探里山活動: ${ev.name}`);
                            const details = encodeURIComponent(`執行單位: ${ev.executor || '里山團隊'}\n報名方式: ${ev.regMethod || '請洽主辦單位'}\n\n👉 更多詳情請至 探探里山-永續旅遊 查看。`), location = encodeURIComponent(ev.location || '水里里山基地');
                            calendarUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}&location=${location}`;
                        }
                    } catch(e) { console.warn('日期解析異常', e); }
                }

                const regs = globalEventRegistrations[ev.name] || [];
                let regsHtml = '';
                const isRegOpen = ev.isRegistrationOpen !== false; 
                
                // 分享按鈕 HTML
                const shareBtnHtml = `<button onclick="window.shareSpecificEvent('${safeEventName}')" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 rounded-lg text-[11px] font-bold shadow-sm transition-all flex items-center shrink-0 w-fit"><i class="fas fa-share-alt mr-1.5"></i> 分享此活動</button>`;

                if(isRegOpen) { 
                    regs.sort((a, b) => {
                        const timeA = a.timestamp ? (typeof a.timestamp.toMillis === 'function' ? a.timestamp.toMillis() : (a.timestamp.seconds * 1000)) : Date.now();
                        const timeB = b.timestamp ? (typeof b.timestamp.toMillis === 'function' ? b.timestamp.toMillis() : (b.timestamp.seconds * 1000)) : Date.now();
                        return timeB - timeA;
                    });
                    
                    const avatarsHtml = regs.map(r => {
                        const borderColor = r.platform === 'LINE' ? 'border-[#06C755]' : (r.platform === 'Facebook' ? 'border-[#1877F2]' : 'border-gray-300');
                        const displayId = (r.userId && r.userId !== 'anonymous') ? r.userId : (r.socialId ? r.socialId.substring(0, 5) + '***' : '無代碼');
                        let timeStr = '剛剛';
                        if (r.timestamp) {
                            try {
                                const ms = typeof r.timestamp.toMillis === 'function' ? r.timestamp.toMillis() : (r.timestamp.seconds * 1000);
                                const dateObj = new Date(ms);
                                if (!isNaN(dateObj)) {
                                    const m = String(dateObj.getMonth() + 1).padStart(2, '0'), d = String(dateObj.getDate()).padStart(2, '0'), h = String(dateObj.getHours()).padStart(2, '0'), min = String(dateObj.getMinutes()).padStart(2, '0');
                                    timeStr = `${m}/${d} ${h}:${min}`;
                                }
                            } catch(e) {}
                        }
                        
                        let customTag = '', nameStyle = 'text-gray-800', avatarStyle = '';
                        if (r.status && r.status.trim() !== '') {
                            const st = r.status.trim();
                            let bgC = 'bg-blue-50', textC = 'text-blue-600', borderC = 'border-blue-100', dotC = 'bg-blue-500';
                            if (st.includes('取消') || st.includes('放棄')) { bgC = 'bg-red-50'; textC = 'text-red-600'; borderC = 'border-red-100'; dotC = 'bg-red-500'; nameStyle = 'text-gray-500'; avatarStyle = 'opacity-80'; } 
                            else if (st.includes('繳費') || st.includes('確認') || st.includes('完成') || st.includes('成功')) { bgC = 'bg-green-50'; textC = 'text-green-700'; borderC = 'border-green-200'; dotC = 'bg-green-500'; } 
                            else if (st.includes('候補') || st.includes('等待')) { bgC = 'bg-amber-50'; textC = 'text-amber-700'; borderC = 'border-amber-200'; dotC = 'bg-amber-500'; }
                            customTag = `<span class="flex items-center text-[10px] ${bgC} ${textC} font-bold px-1.5 py-0.5 rounded border ${borderC} shadow-sm whitespace-nowrap"><span class="w-1.5 h-1.5 rounded-full ${dotC} mr-1 animate-pulse"></span>${st}</span>`;
                        }

                        return `<div class="flex items-center shrink-0 bg-white p-2.5 rounded-xl border border-gray-200 shadow-sm gap-3 hover:border-yellow-300 transition-all duration-300 group"><img src="${r.socialPicture || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full border-2 ${borderColor} shadow-sm object-cover flex-shrink-0 ${avatarStyle}"><div class="flex flex-col items-start min-w-[120px]"><div class="flex items-center gap-2 mb-1"><span class="text-[13px] ${nameStyle} font-bold tracking-wide">${r.socialName || '匿名'}</span><span class="bg-yellow-100 text-yellow-800 text-[9px] font-bold px-1.5 py-0.5 rounded shadow-sm border border-yellow-200 whitespace-nowrap">${timeStr}</span></div><div class="flex items-center gap-1.5"><span class="text-[10px] text-gray-500 font-mono tracking-tighter bg-gray-50 border border-gray-200 px-1.5 py-px rounded w-fit shadow-sm">${displayId}</span>${customTag}</div></div></div>`;
                    }).join('');
                    
                    const isExpanded = window.expandedRegEvents.has(ev.name);
                    
                    let toggleBtnText = isExpanded ? '<i class="fas fa-chevron-up mr-1.5"></i>隱藏名單' : '<i class="fas fa-chevron-down mr-1.5"></i>查看報名清單';
                    let toggleBtnClass = isExpanded ? 'bg-yellow-100 text-yellow-800 hover:bg-yellow-200' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50';

                    let countDisplay = '<i class="fas fa-spinner fa-spin text-yellow-500 mx-1 text-sm"></i>';
                    if (window.isRegSnapshotLoaded) { 
                        countDisplay = `<span class="text-yellow-600 mx-1 text-base font-black">${regs.length}</span>`; 
                    }
                    
                    const countHtml = `<p class="text-[11px] font-bold text-gray-700 flex items-center m-0 tracking-wide"><i class="fas fa-users text-yellow-500 mr-1.5 text-base"></i>已報名：${countDisplay} 人</p>`;

                    let avatarsSection = '';
                    if (isExpanded) {
                        if (!window.isRegSnapshotLoaded) { 
                            avatarsSection = `<div class="flex justify-center items-center py-5 text-yellow-600 text-sm font-bold border-t border-yellow-200 mt-2 animate-pulse"><i class="fas fa-circle-notch fa-spin mr-2 text-lg"></i>連線至資料庫抓取中...</div>`; 
                        } else if (regs.length > 0) { 
                            avatarsSection = `<div class="flex gap-2.5 overflow-x-auto custom-scrollbar pb-3 pt-2 pr-2 animate-fade-in-down border-t border-yellow-200 mt-2">${avatarsHtml}</div>`; 
                        } else { 
                            avatarsSection = `<div class="flex justify-center items-center py-5 text-gray-500 text-sm font-bold border-t border-yellow-200 mt-2 animate-fade-in-down"><i class="fas fa-user-slash mr-2 text-lg opacity-50"></i>目前尚無人報名</div>`; 
                        }
                    }

                    regsHtml = `<div class="mb-4 pt-4 border-t-2 border-dashed border-gray-200 bg-gray-50/80 -mx-5 px-5 sm:-mx-6 sm:px-6 shadow-inner pb-2 transition-all duration-300"><div class="flex flex-col sm:flex-row sm:items-center justify-between mb-2 gap-3"><div class="flex items-center flex-wrap gap-3">${countHtml}${shareBtnHtml}</div><button onclick="window.toggleRegList('${ev.name.replace(/'/g, "\\'")}')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center justify-center w-full sm:w-auto ${toggleBtnClass}">${toggleBtnText}</button></div>${avatarsSection}</div>`;
                } else {
                    regsHtml = `<div class="mb-4 pt-4 border-t-2 border-dashed border-gray-200 bg-gray-100/80 -mx-5 px-5 sm:-mx-6 sm:px-6 shadow-inner pb-3"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div class="flex items-center flex-wrap gap-3"><p class="text-[10px] font-black text-gray-500 flex items-center m-0"><i class="fas fa-users text-gray-400 mr-1.5 text-base"></i>已報名：0 人</p>${shareBtnHtml}</div><p class="text-[10px] text-gray-400 font-bold m-0 sm:mt-1"><i class="fas fa-shield-alt mr-1 opacity-70"></i>由本站辦理之活動才適用快速報名</p></div></div>`;
                }

                if(isExpired) {
                    return `<div data-event-name="${safeEventName}" class="bg-gray-50 p-5 md:p-6 rounded-2xl border border-gray-200 shadow-sm relative overflow-hidden mb-4 opacity-90 transition-all"><div class="absolute top-0 right-0 bg-gray-400 text-white text-[10px] font-bold px-3 py-1.5 rounded-bl-xl z-10 flex items-center shadow-sm"><i class="fas fa-flag-checkered mr-1.5"></i>活動已圓滿結束</div><h4 class="text-xl font-bold text-gray-600 mb-3 leading-snug">${ev.name}</h4><div class="inline-flex items-center px-3 py-1 bg-gray-200 text-gray-600 rounded text-xs font-bold border border-gray-300 mb-4 shadow-sm"><i class="fas fa-clock mr-1.5"></i> ${ev.date}</div><div class="space-y-2 text-[13px] text-gray-500 mb-5"><p class="flex items-start"><i class="fas fa-sitemap mr-2.5 mt-0.5 text-gray-400 w-3 text-center shrink-0"></i> <span class="font-bold mr-1 shrink-0">執行單位:</span> <span class="leading-relaxed">${ev.executor || '里山團隊'}</span></p><p class="flex items-start"><i class="fas fa-map-marker-alt mr-2.5 mt-0.5 text-gray-400 w-3 text-center shrink-0"></i> <span class="font-bold mr-1 shrink-0">活動地點:</span> <span class="leading-relaxed">${ev.location || '水里里山基地'}</span></p><p class="flex items-start"><i class="fas fa-hourglass-half mr-2.5 mt-0.5 text-gray-400 w-3 text-center shrink-0"></i> <span class="font-bold mr-1 shrink-0">報名截止:</span> <span class="text-gray-500 font-bold">${ev.deadline || '請見詳情'}</span></p>${(ev.remark && ev.remark.trim() !== '') ? `<p class="flex items-start mt-2 pt-2 border-t border-gray-200"><i class="fas fa-sticky-note mr-2.5 mt-0.5 text-gray-400 w-3 text-center shrink-0"></i> <span class="font-bold mr-1 shrink-0">備註:</span> <span class="leading-relaxed text-gray-500">${ev.remark}</span></p>` : ''}</div>${regsHtml}</div>`;
                } else {
                    let regMethodHtml = '';
                    if (isRegOpen) { 
                        regMethodHtml = `<div class="bg-yellow-50 text-yellow-700 px-3 py-1.5 rounded-lg border border-yellow-200 font-bold shadow-sm text-[11px] flex items-center w-full sm:w-fit"><i class="fas fa-broadcast-tower mr-1.5 animate-pulse text-yellow-500 text-xs"></i>報名中...依報名先後或主辦單位通知錄取</div>`; 
                    } else {
                        if(ev.regMethod && (ev.regMethod.startsWith('http') || ev.regMethod.startsWith('www'))) { 
                            let url = ev.regMethod.startsWith('www') ? 'https://' + ev.regMethod : ev.regMethod;
                            regMethodHtml = `<a href="${url}" target="_blank" class="bg-gray-50 text-gray-600 px-3 py-1.5 rounded-lg border border-gray-200 break-all font-bold hover:bg-gray-100 transition underline text-center sm:text-left shadow-sm text-[11px] flex items-center w-full sm:w-fit"><i class="fas fa-external-link-alt mr-1.5 text-xs"></i>點擊前往外部報名網頁</a>`; 
                        } else if (ev.regMethod) { 
                            regMethodHtml = `<div class="bg-gray-50 text-gray-600 px-3 py-1.5 rounded-lg border border-gray-200 break-words whitespace-normal font-bold shadow-sm text-[11px] flex items-center w-full sm:w-fit"><i class="fas fa-info-circle mr-1.5 text-xs"></i>${ev.regMethod}</div>`; 
                        } else { 
                            regMethodHtml = `<div class="bg-gray-50 text-gray-400 px-3 py-1.5 rounded-lg border border-gray-200 font-bold shadow-sm text-[11px] flex items-center w-full sm:w-fit"><i class="fas fa-ban mr-1.5 text-xs"></i>已停止站內報名，詳情請洽主辦單位</div>`; 
                        }
                    }
                    
                    const quickRegBtnHtml = isRegOpen 
                        ? `<button onclick="window.openRegistrationModal('${ev.name.replace(/'/g, "\\'")}')" class="shrink-0 w-full sm:w-auto px-6 py-3 bg-gradient-to-r from-yellow-400 to-yellow-500 text-yellow-900 rounded-xl hover:shadow-lg hover:-translate-y-0.5 transition-all text-[15px] font-black shadow-md flex items-center justify-center border-b-4 border-yellow-600"><i class="fas fa-bolt mr-1.5 text-white"></i>一鍵快速報名</button>` 
                        : `<button disabled class="shrink-0 w-full sm:w-auto px-5 py-2.5 bg-gray-100 border border-gray-200 text-gray-400 rounded-lg cursor-not-allowed text-xs font-bold shadow-sm flex items-center justify-center"><i class="fas fa-lock mr-1.5 opacity-50"></i>請參照左側說明</button>`;

                    return `<div data-event-name="${safeEventName}" class="bg-white p-5 md:p-6 rounded-2xl border border-gray-200 shadow-md relative overflow-hidden mb-6 hover:shadow-xl transition-all duration-300"><h4 class="text-xl md:text-2xl font-black text-gray-800 mb-3 leading-snug tracking-wide">${ev.name}</h4><div class="inline-flex items-center px-3 py-1 bg-yellow-100 text-yellow-800 rounded text-sm font-bold border border-yellow-300 mb-4 shadow-sm"><i class="fas fa-clock mr-1.5 text-yellow-600"></i> ${ev.date}</div><div class="space-y-2 text-[13px] text-gray-600 mb-6"><p class="flex items-start"><i class="fas fa-sitemap mr-2.5 mt-0.5 text-gray-400 w-3 text-center shrink-0"></i> <span class="font-bold mr-1 shrink-0 text-gray-700">執行單位:</span> <span class="leading-relaxed">${ev.executor || '里山團隊'}</span></p><p class="flex items-start"><i class="fas fa-map-marker-alt mr-2.5 mt-0.5 text-red-400 w-3 text-center shrink-0"></i> <span class="font-bold mr-1 shrink-0 text-gray-700">活動地點:</span> <span class="leading-relaxed">${ev.location || '水里里山基地'}</span></p><p class="flex items-start"><i class="fas fa-hourglass-half mr-2.5 mt-0.5 text-orange-400 w-3 text-center shrink-0"></i> <span class="font-bold mr-1 shrink-0 text-gray-700">報名截止:</span> <span class="text-red-500 font-bold">${ev.deadline || '請見詳情'}</span></p>${(ev.remark && ev.remark.trim() !== '') ? `<p class="flex items-start mt-2 pt-2 border-t border-gray-100"><i class="fas fa-info-circle mr-2.5 mt-0.5 text-blue-400 w-3 text-center shrink-0"></i> <span class="font-bold mr-1 shrink-0 text-blue-700">活動備註:</span> <span class="leading-relaxed text-blue-700 font-bold">${ev.remark}</span></p>` : ''}</div>${regsHtml}<div class="flex flex-col lg:flex-row justify-between items-start lg:items-end pt-5 border-t-2 border-gray-100 gap-4"><div class="flex flex-col items-start w-full lg:w-auto flex-grow gap-2"><div class="flex items-center"><i class="fas fa-info-circle text-yellow-500 mr-1.5 shrink-0 text-lg"></i><span class="font-black text-gray-700 shrink-0 text-[13px]">報名方式:</span></div>${regMethodHtml}</div><div class="flex gap-3 w-full lg:w-auto flex-wrap">${quickRegBtnHtml}<button onclick="${calendarUrl !== '#' ? `window.open('${calendarUrl}', '_blank')` : `window.showToast('活動日期格式異常，無法產生行事曆連結')`}" class="shrink-0 w-full sm:w-auto px-4 py-2.5 bg-white border border-gray-200 text-gray-600 rounded-lg hover:bg-gray-50 transition text-xs font-bold shadow-sm flex items-center justify-center"><i class="far fa-calendar-plus mr-1.5 text-blue-500 text-sm"></i> 加到行事曆</button></div></div></div>`;
                }
            }).join('');
            
            if(container) container.innerHTML = html;

            if (!window.hasHandledDeepLink && processedEvents.length > 0) {
                const urlParams = new URLSearchParams(window.location.search);
                const eventParam = urlParams.get('event');
                if (eventParam) {
                    window.hasHandledDeepLink = true;
                    setTimeout(() => {
                        const safeSearchParam = encodeURIComponent(eventParam).replace(/'/g, "%27");
                        const targetCard = document.querySelector(`#event-schedule-container [data-event-name="${safeSearchParam}"]`);
                        if (targetCard) {
                            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            targetCard.classList.add('ring-4', 'ring-blue-400', 'ring-offset-4', 'z-10');
                            window.showToast('🎯 已為您定位到專屬活動！');
                            setTimeout(() => { targetCard.classList.remove('ring-4', 'ring-blue-400', 'ring-offset-4', 'z-10'); }, 4000);
                        }
                    }, 800);
                }
            }
        };

        // LINE 授權與報名邏輯
        let currentSocialData = null; 

        async function initLineLiff() {
            if (MY_LINE_LIFF_ID === '請在這裡填入您的_LIFF_ID') return;
            try {
                await liff.init({ liffId: MY_LINE_LIFF_ID });
                if (liff.isLoggedIn()) {
                    const pendingEvent = localStorage.getItem('pending_line_reg_event');
                    if (pendingEvent) {
                        window.showToast('🔄 LINE 授權成功，載入資料中...');
                        const profile = await liff.getProfile();
                        currentSocialData = { platform: 'LINE', id: profile.userId, name: profile.displayName, picture: profile.pictureUrl || 'https://via.placeholder.com/150' };
                        
                        window.currentRegEvent = pendingEvent;
                        const nameEl = document.getElementById('reg-event-name'); if(nameEl) nameEl.textContent = pendingEvent;
                        
                        document.getElementById('social-user-avatar').src = currentSocialData.picture;
                        document.getElementById('social-user-avatar').className = "w-12 h-12 rounded-full border-2 border-[#06C755] shadow-sm object-cover";
                        document.getElementById('social-user-name').textContent = currentSocialData.name;
                        document.getElementById('social-user-id').textContent = 'LINE ID: ' + currentSocialData.id;
                        
                        document.getElementById('social-auth-step').classList.add('hidden');
                        document.getElementById('social-preview-step').classList.remove('hidden');
                        
                        window.openModal('event-registration-modal');
                        localStorage.removeItem('pending_line_reg_event');
                    }
                }
            } catch (err) { console.error('LIFF 初始化失敗', err); }
        }

        window.openRegistrationModal = function(eventName) {
            window.currentRegEvent = eventName;
            const nameEl = document.getElementById('reg-event-name'); if(nameEl) nameEl.textContent = eventName;
            document.getElementById('social-auth-step').classList.remove('hidden');
            document.getElementById('social-preview-step').classList.add('hidden');
            currentSocialData = null;
            window.openModal('event-registration-modal');
        };

        document.getElementById('line-login-btn')?.addEventListener('click', async () => {
            if (typeof MY_LINE_LIFF_ID === 'undefined' || MY_LINE_LIFF_ID === '請在這裡填入您的_LIFF_ID') {
                return window.showToast('⚠️ 系統尚未設定 LINE LIFF ID');
            }
            try {
                await liff.ready; 

                if (!liff.isLoggedIn()) {
                    localStorage.setItem('pending_line_reg_event', window.currentRegEvent);
                    liff.login({ redirectUri: window.location.href });
                } else {
                    window.showToast('🔄 授權成功，載入資料中...');
                    const profile = await liff.getProfile();
                    currentSocialData = { platform: 'LINE', id: profile.userId, name: profile.displayName, picture: profile.pictureUrl || 'https://via.placeholder.com/150' };
                    document.getElementById('social-user-avatar').src = currentSocialData.picture;
                    document.getElementById('social-user-avatar').className = "w-12 h-12 rounded-full border-2 border-[#06C755] shadow-sm object-cover";
                    document.getElementById('social-user-name').textContent = currentSocialData.name;
                    document.getElementById('social-user-id').textContent = 'LINE ID: ' + currentSocialData.id;
                    document.getElementById('social-auth-step').classList.add('hidden');
                    document.getElementById('social-preview-step').classList.remove('hidden');
                }
            } catch (err) {
                console.error("LINE 登入呼叫失敗:", err);
                window.showToast('🚨 無法啟動 LINE 授權！');
                alert('【環境安全阻擋】\n\n無法啟動 LINE 登入。這通常是因為：\n1. 您正在右側的 AI 預覽視窗測試（沙盒會嚴格阻擋外部授權跳轉）。\n2. 您在電腦本機端雙擊開啟。\n\n👉 解決方案：請將此檔案上傳至 GitHub，並在正式網址測試即可恢復正常！');
            }
        });

        document.getElementById('final-submit-reg-btn')?.addEventListener('click', async (e) => {
            if (!currentSocialData) return;
            const originalHtml = e.currentTarget.innerHTML;
            e.currentTarget.disabled = true;
            e.currentTarget.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>處理中...';

            try {
                if (!db || typeof addDoc !== 'function') throw new Error("資料庫連線模組未就緒");

                const regData = {
                    eventName: window.currentRegEvent,
                    platform: currentSocialData.platform,
                    socialId: currentSocialData.id,
                    socialName: currentSocialData.name,
                    socialPicture: currentSocialData.picture,
                    userId: 'anonymous_visitor',
                    timestamp: serverTimestamp()
                };

                if (!globalEventRegistrations[window.currentRegEvent]) globalEventRegistrations[window.currentRegEvent] = [];
                globalEventRegistrations[window.currentRegEvent].unshift({ ...regData, timestamp: { seconds: Math.floor(Date.now() / 1000) } });
                window.expandedRegEvents.add(window.currentRegEvent);
                if(typeof window.renderEventsListUI === 'function') window.renderEventsListUI();

                await addDoc(collection(db, 'event_registrations'), regData);
                window.showToast('✅ 報名成功！大頭貼已即時上榜。');
                window.closeModal('event-registration-modal');
            } catch (err) {
                window.showToast(`🚨 報名失敗: ${err.message}`);
            } finally {
                e.currentTarget.disabled = false; e.currentTarget.innerHTML = originalHtml;
            }
        });

        // 關閉 Modal 點擊背景遮罩機制
        document.querySelectorAll('.modal-overlay .close-button').forEach(btn => {
            btn.addEventListener('click', (e) => { const m = e.target.closest('.modal-overlay'); if (m) m.classList.add('hidden'); });
        });

        // Firebase 啟動程序
        function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                signInAnonymously(auth).catch(() => console.warn('匿名登入失敗'));
                
                onAuthStateChanged(auth, user => { 
                    if(user && db) {
                        onSnapshot(doc(db, 'system_messages', 'event_schedule'), (docSnap) => {
                            if(docSnap.exists() && docSnap.data().events) {
                                window.currentEventsList = docSnap.data().events; 
                                if(typeof window.renderEventsListUI === 'function') window.renderEventsListUI();
                            }
                        });

                        onSnapshot(collection(db, 'event_registrations'), (snapshot) => {
                            window.isRegSnapshotLoaded = true; // 標記：報名資料庫已完成即時同步
                            globalEventRegistrations = {};
                            snapshot.forEach(doc => {
                                const data = doc.data();
                                if(data.eventName) {
                                    if(!globalEventRegistrations[data.eventName]) globalEventRegistrations[data.eventName] = [];
                                    globalEventRegistrations[data.eventName].push(data);
                                }
                            });
                            if(typeof window.renderEventsListUI === 'function') window.renderEventsListUI();
                        }, (error) => {
                            console.error("❌ 讀取報名名單失敗:", error);
                        });
                    }
                });
            } catch (e) { console.error("Firebase init error:", e); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initLineLiff();
            initFirebase();
        });
    </script>
</body>
</html>
