    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getFirestore, collection, doc, addDoc, onSnapshot, serverTimestamp, query, where, getDocs, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCEH65YbNirj_IRmtsIJZS-HNEbsRBBsSQ", authDomain: "sustainable-tourism-65025.firebaseapp.com", projectId: "sustainable-tourism-65025" };
        let db = null, auth = null;
        
        window.currentEventsList = [];
        window.globalEventRegistrations = {};
        window.hiddenRegEvents = new Set();
        window.hasHandledDeepLink = false;
        window.isRegSnapshotLoaded = false;
        window.toastTimer = null;

        let state = { lineUserId: '', playerCode: '' };
        function loadLocalData() {
            try { const raw = localStorage.getItem('shuilMoriData_v3.0'); if(raw) { state = { ...state, ...JSON.parse(raw) }; } } catch(e) { }
            if (!state.playerCode) { state.playerCode = Math.random().toString(36).substring(2, 7).toUpperCase(); try { localStorage.setItem('shuilMoriData_v3.0', JSON.stringify(state)); } catch(e) {} }
        }
        function saveData() { try { localStorage.setItem('shuilMoriData_v3.0', JSON.stringify(state)); } catch(e) {} }
        loadLocalData();

        window.showToast = function(msg) {
            let toast = document.getElementById('custom-toast');
            if(toast) { 
                toast.textContent = msg; toast.classList.add('show'); 
                if(window.toastTimer) clearTimeout(window.toastTimer);
                window.toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 3000); 
            }
        };

        window.openModal = function(modalId) { document.getElementById(modalId)?.classList.remove('hidden'); };
        window.closeModal = function(modalId) { document.getElementById(modalId)?.classList.add('hidden'); };

        window.customPrompt = function(message, defaultValue, callback) {
            const modal = document.getElementById('custom-prompt-modal'); const titleEl = document.getElementById('custom-prompt-title'); const inputEl = document.getElementById('custom-prompt-input');
            const confirmBtn = document.getElementById('custom-prompt-confirm'); const cancelBtn = document.getElementById('custom-prompt-cancel');
            if(!modal) return callback(defaultValue);
            titleEl.textContent = message; inputEl.value = defaultValue;
            confirmBtn.onclick = () => { window.closeModal('custom-prompt-modal'); callback(inputEl.value); };
            cancelBtn.onclick = () => { window.closeModal('custom-prompt-modal'); callback(null); };
            window.openModal('custom-prompt-modal'); setTimeout(() => { inputEl.focus(); inputEl.select(); }, 100);
        };

        window.updateDashboardUrl = function(cardId) {
            const btnEnt = document.getElementById(`btn-ent-${cardId}`);
            const btnGov = document.getElementById(`btn-gov-${cardId}`);
            const inputNum = document.getElementById(`input-num-${cardId}`);
            const urlDisplay = document.getElementById(`display-url-${cardId}`);
            if (!urlDisplay) return;
            let boardCode = inputNum ? inputNum.value.trim().toUpperCase() : '';
            let finalUrl = '';
            if (btnEnt && btnEnt.getAttribute('data-active') === 'true') { finalUrl = `https://farmcmd.github.io/ESGT/#ESG-board${boardCode ? '-' + boardCode : ''}`; } 
            else if (btnGov && btnGov.getAttribute('data-active') === 'true') { finalUrl = `https://farmcmd.github.io/ESGT/#OKR-board${boardCode ? '-' + boardCode : ''}`; }
            urlDisplay.value = finalUrl;
        };

        window.openDashboard = function(cardId) {
            const urlDisplay = document.getElementById(`display-url-${cardId}`);
            if (urlDisplay && urlDisplay.value && urlDisplay.value.includes('#')) { window.open(urlDisplay.value, '_blank'); } 
            else { window.showToast('⚠️ 請先點擊選擇企業或政府儀表板！'); }
        };

        // ✨ 核心升級：子網頁的發射器 (一鍵帶入儀表板)
        window.autoFillDashboard = function(type, code) {
            if (window.self !== window.top) {
                // 如果在 Iframe 裡面，把代碼當作球丟給外面的主網頁去接
                window.parent.postMessage({ 
                    action: 'FILL_DASHBOARD_CODE', 
                    boardType: type, 
                    boardCode: code 
                }, '*');
            } else {
                // 如果是直接用瀏覽器開這個獨立網頁，就用網址跳轉的方式帶回去主系統
                window.location.href = `https://farmcmd.github.io/ESGT/?dashboard=${type}&code=${code}`;
            }
        };

        window.unlockAdminPanel = function(cardId) {
            window.customPrompt('🧙‍♂️ 請輸入管理員密碼：', '', (pwd) => {
                if (pwd === '545366' || pwd === '772059' || pwd === 'mori2025') {
                    const btnEnt = document.getElementById(`btn-ent-${cardId}`);
                    const btnGov = document.getElementById(`btn-gov-${cardId}`);
                    const inputNum = document.getElementById(`input-num-${cardId}`);
                    const lockBtn = document.getElementById(`admin-lock-btn-${cardId}`);
                    const saveBtn = document.getElementById(`btn-save-${cardId}`);
                    [btnEnt, btnGov].forEach(btn => { if (btn) { btn.disabled = false; btn.classList.remove('bg-gray-100', 'text-gray-400'); btn.classList.add('cursor-pointer'); } });
                    if (inputNum) { inputNum.disabled = false; inputNum.classList.remove('bg-gray-100'); }
                    if (saveBtn) saveBtn.classList.remove('hidden');
                    if (lockBtn) { lockBtn.innerHTML = '<i class="fas fa-unlock-alt text-green-500"></i>'; lockBtn.disabled = true; }
                    window.showToast('✨ 魔法解除！修改後請點擊打勾儲存。');
                } else if (pwd !== null) { window.showToast('❌ 密碼錯誤！'); }
            });
        };

        window.toggleBoard = function(cardId, type) {
            const btn = document.getElementById(`btn-${type}-${cardId}`);
            if (!btn || btn.disabled) return;
            const isActive = btn.getAttribute('data-active') === 'true';
            btn.setAttribute('data-active', isActive ? 'false' : 'true');
            if (type === 'ent') { 
                const btnGov = document.getElementById(`btn-gov-${cardId}`); 
                if (btnGov && !isActive) { btnGov.setAttribute('data-active', 'false'); btnGov.className = "flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded transition-all bg-white text-gray-600 border border-gray-300 shrink-0"; }
            } else {
                const btnEnt = document.getElementById(`btn-ent-${cardId}`);
                if (btnEnt && !isActive) { btnEnt.setAttribute('data-active', 'false'); btnEnt.className = "flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded transition-all bg-white text-gray-600 border border-gray-300 shrink-0"; }
            }
            if (!isActive) {
                btn.className = type === 'ent' ? "flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded transition-all bg-yellow-100 text-yellow-700 border border-yellow-400 shrink-0" : "flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded transition-all bg-blue-100 text-blue-700 border border-blue-400 shrink-0";
            } else {
                btn.className = "flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded transition-all bg-white text-gray-600 border border-gray-300 shrink-0";
            }
            window.updateDashboardUrl(cardId);
        };

        window.saveAdminPanel = async function(cardId, encodedEventName) {
            const eventName = decodeURIComponent(encodedEventName);
            const btnEnt = document.getElementById(`btn-ent-${cardId}`);
            const btnGov = document.getElementById(`btn-gov-${cardId}`);
            const inputNum = document.getElementById(`input-num-${cardId}`);
            let boardType = (btnEnt && btnEnt.getAttribute('data-active') === 'true') ? 'ent' : ((btnGov && btnGov.getAttribute('data-active') === 'true') ? 'gov' : '');
            let boardCode = inputNum ? inputNum.value.trim().toUpperCase() : '';
            if (db) {
                try {
                    const docRef = doc(db, 'system_messages', 'event_schedule');
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        let events = snap.data().events || [];
                        let idx = events.findIndex(e => e.name === eventName);
                        if (idx !== -1) { events[idx].boardType = boardType; events[idx].boardCode = boardCode; await updateDoc(docRef, { events: events }); window.showToast('✅ 看板設定已同步雲端！'); }
                    }
                } catch(e) { window.showToast('❌ 同步失敗'); }
            }
        };

        window.shareSpecificEvent = function(shortId, encodedEventName) {
            const eventName = decodeURIComponent(encodedEventName); 
            const url = new URL(window.location.origin + window.location.pathname);
            url.searchParams.set('id', shortId); 
            const finalUrl = url.toString(); 
            const shareText = `🔗 邀請您參加【${eventName}】！\n查看詳情：${finalUrl}`;
            window.currentShareData = { url: finalUrl, text: shareText };
            if (navigator.share) { navigator.share({ title: '探探里山', text: shareText, url: finalUrl }).catch(() => window.openModal('share-event-modal')); } 
            else { window.openModal('share-event-modal'); }
        };

        window.toggleRegList = function(eventName) {
            if (window.hiddenRegEvents.has(eventName)) { window.hiddenRegEvents.delete(eventName); } 
            else { window.hiddenRegEvents.add(eventName); }
            window.renderEventsListUI();
        };

        window.renderEventsListUI = function() {
            const container = document.getElementById('event-schedule-container');
            if (!window.currentEventsList.length) return;
            const today = new Date(); today.setHours(0,0,0,0);
            const processedEvents = [...window.currentEventsList].map(ev => { let isExpired = false; if(ev.date) { const evDate = new Date(ev.date.replace(/-/g, '/')); if(!isNaN(evDate) && evDate < today) isExpired = true; } return { ...ev, isExpired }; }).sort((a,b) => (a.isExpired === b.isExpired ? 0 : (a.isExpired ? 1 : -1)));

            container.innerHTML = processedEvents.map((ev, index) => {
                const isExpired = ev.isExpired;
                const safeEventName = encodeURIComponent(ev.name).replace(/'/g, "%27");
                const dateStr = (ev.date || '00000000').replace(/[\/\-]/g, '');
                const shortId = `${dateStr}-${index + 1}`;
                const regs = window.globalEventRegistrations[ev.name] || [];
                const isExpanded = !window.hiddenRegEvents.has(ev.name);
                
                // ==========================
                // 處理已過期卡片的渲染
                // ==========================
                if (isExpired) {
                    let savedBoardType = ev.boardType || '';
                    let savedBoardCode = ev.boardCode || '';
                    let initUrl = savedBoardType === 'ent' ? `https://farmcmd.github.io/ESGT/#ESG-board${savedBoardCode ? '-' + savedBoardCode : ''}` : (savedBoardType === 'gov' ? `https://farmcmd.github.io/ESGT/#OKR-board${savedBoardCode ? '-' + savedBoardCode : ''}` : '');

                    // ✨ 為一般旅客渲染「一鍵帶入」按鈕 (只要管理員有設定代碼就顯示)
                    let quickBindHtml = '';
                    if (savedBoardType && savedBoardCode) {
                        const isEnt = savedBoardType === 'ent';
                        const btnColorClass = isEnt ? 'from-yellow-400 to-yellow-500 hover:shadow-yellow-500/30' : 'from-blue-500 to-blue-600 hover:shadow-blue-500/30';
                        const iconClass = isEnt ? 'fa-building' : 'fa-landmark';
                        const boardName = isEnt ? '企業永續儀表板' : '永續政府儀表板';
                        
                        quickBindHtml = `
                        <div class="mt-4 pt-4 border-t-2 border-dashed border-gray-100">
                            <button onclick="window.autoFillDashboard('${savedBoardType}', '${savedBoardCode}')" class="w-full py-3 bg-gradient-to-r ${btnColorClass} text-white rounded-xl font-bold shadow-md hover:shadow-lg transition-all flex items-center justify-center group transform hover:-translate-y-0.5 animate-pulse">
                                <i class="fas ${iconClass} text-xl mr-2 group-hover:scale-110 transition-transform"></i> 
                                一鍵帶入歸戶：${boardName}
                                <span class="ml-2 bg-white/20 px-2 py-0.5 rounded text-xs font-mono tracking-widest">#${savedBoardCode}</span>
                            </button>
                        </div>
                        `;
                    }

                    return `<div data-event-id="${shortId}" class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm relative opacity-95 mb-4 transition-all hover:shadow-md">
                        <div class="absolute top-0 right-0 bg-gray-400 text-white text-[10px] font-bold px-3 py-1.5 rounded-bl-xl z-10 flex flex-col items-end shadow-sm">
                            <span class="flex items-center"><i class="fas fa-flag-checkered mr-1.5"></i>活動已結束</span>
                            <span class="text-[8px] mt-0.5 opacity-80">建議將本頁面加到手機桌面隨時查詢新活動</span>
                        </div>
                        <h4 class="text-xl font-bold text-gray-600 mb-3 pr-20">${ev.name}</h4>
                        <div class="inline-flex items-center px-3 py-1 bg-gray-100 text-gray-500 rounded text-xs font-bold border border-gray-200 mb-4">
                            <i class="fas fa-clock mr-1.5"></i> ${ev.date} <span class="ml-2 font-mono text-[10px] opacity-60">#${shortId}</span>
                        </div>
                        <div class="text-[13px] text-gray-500 mb-4 border-l-4 border-gray-200 pl-3">
                            <p><strong>活動地點:</strong> ${ev.location || '水里里山基地'}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-dashed border-gray-200 flex items-center justify-between">
                            <p class="text-xs font-bold text-gray-500">目前報名：${regs.length} 人</p>
                            <button onclick="window.shareSpecificEvent('${shortId}', '${safeEventName}')" class="px-3 py-1 bg-gray-50 hover:bg-blue-50 hover:text-blue-600 text-gray-500 border border-gray-200 hover:border-blue-200 rounded-lg text-[11px] font-bold shadow-sm transition-all flex items-center"><i class="fas fa-share-alt mr-1.5"></i> 分享此活動</button>
                        </div>
                        
                        ${quickBindHtml}

                        <!-- 管理員成效區 (過期卡片專屬) -->
                        <div class="mt-4 p-3 bg-gray-50 rounded-xl border border-gray-200 flex flex-col gap-2">
                             <div class="flex items-center gap-2">
                                <button onclick="window.unlockAdminPanel('${shortId}')" id="admin-lock-btn-${shortId}" class="w-7 h-7 flex items-center justify-center bg-white border border-gray-300 rounded-full shadow-sm text-xs" title="解鎖編輯看板"><i class="fas fa-lightbulb grayscale opacity-50"></i></button>
                                <button id="btn-ent-${shortId}" data-active="${savedBoardType==='ent'}" disabled onclick="window.toggleBoard('${shortId}','ent')" class="flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded transition-all ${savedBoardType==='ent'?'bg-yellow-100 text-yellow-700 border-yellow-400':'bg-white text-gray-400 border-gray-200'}">企業永續</button>
                                <button id="btn-gov-${shortId}" data-active="${savedBoardType==='gov'}" disabled onclick="window.toggleBoard('${shortId}','gov')" class="flex items-center gap-1.5 text-[10px] font-black px-2.5 py-1 rounded transition-all ${savedBoardType==='gov'?'bg-blue-100 text-blue-700 border-blue-400':'bg-white text-gray-400 border-gray-200'}">永續政府</button>
                                <input type="text" id="input-num-${shortId}" maxlength="5" value="${savedBoardCode}" disabled class="w-16 px-1.5 py-0.5 text-xs font-mono border rounded text-center bg-gray-100">
                                <button id="btn-save-${shortId}" onclick="window.saveAdminPanel('${shortId}', '${safeEventName}')" class="hidden w-6 h-6 bg-green-500 text-white rounded shadow-md flex items-center justify-center"><i class="fas fa-check text-xs"></i></button>
                             </div>
                             <div class="flex bg-white border border-gray-300 rounded-lg overflow-hidden mt-1">
                                <input type="text" id="display-url-${shortId}" readonly class="w-full px-3 py-1.5 text-[10px] text-blue-600 font-mono truncate bg-transparent focus:outline-none" value="${initUrl}" placeholder="尚未建立儀表板">
                                <button onclick="window.openDashboard('${shortId}')" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-900 transition-colors text-white text-[10px] font-black flex items-center whitespace-nowrap"><i class="fas fa-chart-line mr-1"></i> 管理員查看</button>
                             </div>
                        </div>
                    </div>`;
                } else {
                    const isRegOpen = ev.isRegistrationOpen !== false;
                    const avatarsHtml = regs.map(r => `<div class="shrink-0 bg-white p-2 rounded-lg border border-gray-200 shadow-sm flex items-center gap-2"><img src="${r.socialPicture || 'https://via.placeholder.com/150'}" class="w-8 h-8 rounded-full object-cover border-2 ${r.platform==='LINE'?'border-[#06C755]':'border-blue-500'} shadow-sm"><span class="text-xs font-bold text-gray-700">${r.socialName || '匿名'}</span></div>`).join('');

                    return `<div data-event-id="${shortId}" class="bg-white p-6 rounded-2xl border border-gray-200 shadow-md relative overflow-hidden mb-6 hover:shadow-xl transition-all duration-300">
                        <button onclick="window.shareSpecificEvent('${shortId}', '${safeEventName}')" class="absolute top-4 right-4 z-20 px-3 py-1.5 bg-blue-50 text-blue-600 border border-blue-200 rounded-lg text-xs font-bold shadow-sm transition-all flex items-center"><i class="fas fa-share-alt mr-1.5"></i> 分享此活動</button>
                        <h4 class="text-2xl font-black text-gray-800 mb-3 tracking-wide pr-28">${ev.name}</h4>
                        <div class="inline-flex items-center px-3 py-1 bg-yellow-100 text-yellow-800 rounded text-sm font-bold border border-yellow-300 mb-4 shadow-sm">
                            <i class="fas fa-clock mr-2"></i> ${ev.date} <span class="ml-2 font-mono text-[10px] opacity-40">#${shortId}</span>
                        </div>
                        <div class="space-y-2 text-[14px] text-gray-600 mb-6 border-l-4 border-yellow-400 pl-4">
                            <p><i class="fas fa-sitemap mr-2 opacity-60"></i> <strong>執行單位:</strong> ${ev.executor || '里山團隊'}</p>
                            <p><i class="fas fa-map-marker-alt mr-2 text-red-400"></i> <strong>活動地點:</strong> ${ev.location || '水里里山基地'}</p>
                            <p><i class="fas fa-hourglass-half mr-2 text-orange-400"></i> <strong>截止日期:</strong> <span class="text-red-500 font-bold">${ev.deadline || '請見詳情'}</span></p>
                        </div>
                        <div class="mb-4 pt-4 border-t-2 border-dashed border-gray-100 bg-gray-50/80 -mx-6 px-6 shadow-inner pb-2">
                            <div class="flex items-center justify-between mb-2">
                                <p class="text-[14px] font-bold text-gray-700 flex items-center"><i class="fas fa-users text-yellow-500 mr-2 text-lg"></i>目前報名：<span class="text-yellow-600 mx-1 text-lg font-black">${regs.length}</span> 人</p>
                                <button onclick="window.toggleRegList('${ev.name.replace(/'/g, "\\'")}')" class="px-4 py-2 rounded-xl text-xs font-bold shadow-sm flex items-center ${isExpanded?'bg-yellow-100 text-yellow-800':'bg-white text-yellow-600 border border-yellow-200'}">${isExpanded?'隱藏名單':'查看名單'}</button>
                            </div>
                            ${isExpanded ? `<div class="flex gap-2.5 overflow-x-auto custom-scrollbar pb-3 pt-2 pr-2 animate-fade-in-down border-t border-yellow-100 mt-2">${regs.length ? avatarsHtml : '<div class="w-full py-4 text-center text-gray-400 font-bold text-xs"><i class="fas fa-user-slash mr-2"></i>目前尚未有人報名</div>'}</div>` : ''}
                        </div>
                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t-2 border-gray-100">
                             <div class="bg-yellow-50 text-yellow-700 px-4 py-2 rounded-xl border border-yellow-100 font-bold text-xs flex-grow flex items-center"><i class="fas fa-info-circle mr-2"></i> 報名方式：${isRegOpen ? 'LINE+1快速報名' : (ev.regMethod || '詳情請洽主辦單位')}</div>
                             ${isRegOpen ? `<button onclick="window.openRegistrationModal('${safeEventName}')" class="shrink-0 w-full sm:w-auto px-6 py-2.5 bg-gradient-to-r from-[#06C755] to-[#05B34C] text-white rounded-xl hover:shadow-lg transition-all text-[15px] font-black shadow-md flex items-center justify-center border-b-4 border-[#048F3A]"><i class="fab fa-line mr-2 text-xl"></i>LINE+1 快速報名</button>` : `<button disabled class="shrink-0 w-full sm:w-auto px-5 py-2 bg-gray-100 border border-gray-200 text-gray-400 rounded-lg cursor-not-allowed text-xs font-bold shadow-sm">已停止報名</button>`}
                        </div>
                    </div>`;
                }
            }).join('');

            if (!window.hasHandledDeepLink) {
                const urlParams = new URLSearchParams(window.location.search);
                const eventIdParam = urlParams.get('id');
                if (eventIdParam) {
                    window.hasHandledDeepLink = true;
                    setTimeout(() => {
                        const targetCard = document.querySelector(`#event-schedule-container [data-event-id="${eventIdParam}"]`);
                        if (targetCard) { targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' }); targetCard.classList.add('ring-4', 'ring-blue-400', 'ring-offset-4', 'z-10'); setTimeout(() => targetCard.classList.remove('ring-4', 'ring-blue-400', 'ring-offset-4', 'z-10'), 4000); }
                    }, 800);
                }
            }
        };

        function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                if (db) {
                    onSnapshot(doc(db, 'system_messages', 'event_schedule'), (docSnap) => { window.currentEventsList = docSnap.exists() ? (docSnap.data().events || []) : []; window.renderEventsListUI(); });
                    onSnapshot(collection(db, 'event_registrations'), (snapshot) => {
                        window.isRegSnapshotLoaded = true;
                        window.globalEventRegistrations = {};
                        snapshot.forEach(doc => {
                            const data = doc.data();
                            if(data.eventName) { if(!window.globalEventRegistrations[data.eventName]) window.globalEventRegistrations[data.eventName] = []; window.globalEventRegistrations[data.eventName].push(data); }
                        });
                        window.renderEventsListUI();
                    });
                }
                try { auth = getAuth(app); signInAnonymously(auth).catch(() => console.warn('Auth受限，資料仍可公開讀取')); } catch(e) {}
            } catch (e) { console.error("Firebase init error:", e); }
        }

        document.getElementById('messenger-fallback-btn')?.addEventListener('click', () => {
            const eventName = window.currentRegEvent || '未命名活動';
            const msgTemplate = `活動名稱: ${eventName}\n姓名: \n連絡電話: \nE-mail: \n(註:報名後請隨時留意您的信件確認報名狀態)\n說明:無法使用LINE報名請留言給我們(較晚回覆)`;
            const textArea = document.createElement("textarea"); textArea.value = msgTemplate; textArea.style.position = "fixed"; textArea.style.left = "-9999px";
            document.body.appendChild(textArea); textArea.focus(); textArea.select();
            try { document.execCommand('copy'); window.showToast('📋 已複製報名格式！開啟後請直接貼上'); } catch (err) {} 
            document.body.removeChild(textArea);
            setTimeout(() => { window.open(`https://m.me/Satoyamadining?text=${encodeURIComponent(msgTemplate)}`, '_blank'); }, 800);
        });

        document.getElementById('final-submit-reg-btn')?.addEventListener('click', async (e) => {
            if (!currentSocialData) return;
            const originalHtml = e.currentTarget.innerHTML;
            e.currentTarget.disabled = true; e.currentTarget.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>處理中...';
            const regs = window.globalEventRegistrations[window.currentRegEvent] || [];
            if (regs.some(r => r.socialId === currentSocialData.id)) { window.showToast('⚠️ 您已經報名過囉！'); e.currentTarget.disabled = false; e.currentTarget.innerHTML = originalHtml; return; }
            try {
                const regData = { eventName: window.currentRegEvent, platform: currentSocialData.platform, socialId: currentSocialData.id, socialName: currentSocialData.name, socialPicture: currentSocialData.picture, userId: state.playerCode || 'anonymous', timestamp: serverTimestamp() };
                await addDoc(collection(db, 'event_registrations'), regData);
                window.showToast('✅ 報名成功！大頭貼已即時上榜。');
                window.closeModal('event-registration-modal');
            } catch (err) { window.showToast(`🚨 報名失敗: ${err.message}`); } finally { e.currentTarget.disabled = false; e.currentTarget.innerHTML = originalHtml; }
        });

        let currentSocialData = null; 
        window.openRegistrationModal = async function(encodedEventName) {
            const eventName = decodeURIComponent(encodedEventName);
            window.currentRegEvent = eventName;
            const nameEl = document.getElementById('reg-event-name'); if(nameEl) nameEl.textContent = eventName;
            document.getElementById('social-auth-step').classList.remove('hidden');
            document.getElementById('social-preview-step').classList.add('hidden');
            currentSocialData = null;
            window.openModal('event-registration-modal');
            if (typeof liff !== 'undefined' && liff.isLoggedIn()) {
                try {
                    const profile = await liff.getProfile();
                    currentSocialData = { platform: 'LINE', id: profile.userId, name: profile.displayName, picture: profile.pictureUrl || 'https://via.placeholder.com/150' };
                    document.getElementById('social-user-avatar').src = currentSocialData.picture;
                    document.getElementById('social-user-name').textContent = currentSocialData.name;
                    document.getElementById('social-user-id').textContent = 'LINE ID: ' + currentSocialData.id;
                    document.getElementById('social-auth-step').classList.add('hidden');
                    document.getElementById('social-preview-step').classList.remove('hidden');
                } catch(err) {}
            }
        };

        document.getElementById('line-login-btn')?.addEventListener('click', async () => {
            localStorage.setItem('pending_line_reg_event', window.currentRegEvent);
            try {
                await liff.ready; 
                if (!liff.isLoggedIn()) {
                    const redirectUrl = new URL(window.location.href);
                    redirectUrl.searchParams.set('line_reg', encodeURIComponent(window.currentRegEvent));
                    liff.login({ redirectUri: redirectUrl.toString() });
                }
            } catch (err) { window.showToast('🚨 授權啟動失敗'); }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof MY_LINE_LIFF_ID !== 'undefined') {
                try {
                    await liff.init({ liffId: MY_LINE_LIFF_ID });
                    if (liff.isLoggedIn()) {
                        let urlParams = new URLSearchParams(window.location.search);
                        let urlEvent = urlParams.get('line_reg');
                        if (!urlEvent && urlParams.has('liff.state')) {
                            const stateParams = new URLSearchParams(urlParams.get('liff.state').startsWith('?') ? urlParams.get('liff.state').substring(1) : urlParams.get('liff.state'));
                            urlEvent = stateParams.get('line_reg');
                        }
                        let pendingEvent = urlEvent ? decodeURIComponent(urlEvent) : localStorage.getItem('pending_line_reg_event');
                        if (pendingEvent) {
                            try { const cUrl = new URL(window.location); cUrl.searchParams.delete('line_reg'); cUrl.searchParams.delete('liff.state'); window.history.replaceState({}, '', cUrl); } catch(e) {}
                            const profile = await liff.getProfile();
                            currentSocialData = { platform: 'LINE', id: profile.userId, name: profile.displayName, picture: profile.pictureUrl || 'https://via.placeholder.com/150' };
                            window.currentRegEvent = pendingEvent;
                            window.openRegistrationModal(encodeURIComponent(pendingEvent));
                            localStorage.removeItem('pending_line_reg_event');
                        }
                    }
                } catch(e) {}
            }
            initFirebase();
        });
    </script>
</body>
</html>
